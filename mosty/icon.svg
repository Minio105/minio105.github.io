<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="iconTitle iconDesc">
  <title id="iconTitle">Mostownia — most nad kanionem</title>
  <desc id="iconDesc">Ikona gry: kratownicowy most, ciężarówka i głęboki kanion.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb9d5"/>
      <stop offset=".48" stop-color="#a6d8e5"/>
      <stop offset=".78" stop-color="#d8edf0"/>
      <stop offset="1" stop-color="#f4e8ce"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2bd" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#ffe39a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffe39a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cliffL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6638"/>
      <stop offset=".48" stop-color="#7b4c27"/>
      <stop offset="1" stop-color="#4b2c17"/>
    </linearGradient>
    <linearGradient id="cliffR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06a39"/>
      <stop offset=".5" stop-color="#7b4b26"/>
      <stop offset="1" stop-color="#4a2a15"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c9eab"/>
      <stop offset=".45" stop-color="#2d7785"/>
      <stop offset="1" stop-color="#123f4c"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59646c"/>
      <stop offset=".28" stop-color="#3c464e"/>
      <stop offset="1" stop-color="#222b31"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd083"/>
      <stop offset=".5" stop-color="#f2a044"/>
      <stop offset="1" stop-color="#c06b21"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e7ef"/>
      <stop offset=".5" stop-color="#8fafc2"/>
      <stop offset="1" stop-color="#557487"/>
    </linearGradient>
    <linearGradient id="truck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset=".55" stop-color="#e8aa3b"/>
      <stop offset="1" stop-color="#b8781e"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".72">
      <stop offset=".55" stop-color="#041015" stop-opacity="0"/>
      <stop offset=".85" stop-color="#041015" stop-opacity=".16"/>
      <stop offset="1" stop-color="#041015" stop-opacity=".44"/>
    </radialGradient>
    <clipPath id="scene">
      <rect x="14" y="14" width="484" height="484" rx="94"/>
    </clipPath>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0a1319"/>
  <g clip-path="url(#scene)">
    <rect x="14" y="14" width="484" height="484" fill="url(#sky)"/>

    <!-- słońce i obłoki -->
    <circle cx="394" cy="128" r="104" fill="url(#sunGlow)"/>
    <circle cx="394" cy="128" r="35" fill="#fff0b6"/>
    <circle cx="394" cy="128" r="26" fill="#ffe79b"/>
    <g fill="#ffffff" opacity=".58">
      <path d="M104 118c0-9 7-16 16-16 4 0 8 2 11 4 3-12 14-21 27-21 15 0 27 11 28 26 2-1 4-1 6-1 10 0 18 8 18 18H104Z"/>
      <path d="M304 186c0-6 5-11 11-11 3 0 5 1 7 2 2-8 9-14 18-14 10 0 18 8 18 18 8 0 14 6 14 13h-68Z" opacity=".7"/>
    </g>
    <g fill="#31586a" opacity=".55">
      <path d="M120 178c7-5 14-5 21 0 7-5 14-5 21 0" fill="none" stroke="#31586a" stroke-width="3" stroke-linecap="round"/>
      <path d="M280 96c6-4 12-4 18 0 6-4 12-4 18 0" fill="none" stroke="#31586a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- dalekie góry -->
    <path d="M14 300 62 258 108 292 150 244 202 300 250 264 300 302 352 252 402 298 450 262 498 304V498H14Z"
          fill="#527f7d" opacity=".34"/>
    <path d="M14 326 74 292 128 322 184 286 238 326 296 294 354 326 412 288 468 322 498 306V498H14Z"
          fill="#3c6568" opacity=".42"/>

    <!-- rzeka i dno kanionu -->
    <path d="M132 418h248l30 80H102Z" fill="url(#river)"/>
    <g stroke="#b7ecef" stroke-linecap="round" opacity=".55">
      <path d="M186 444h44" stroke-width="4"/>
      <path d="M270 452h58" stroke-width="5"/>
      <path d="M228 472h72" stroke-width="4"/>
      <path d="M174 486h40" stroke-width="3"/>
      <path d="M310 488h48" stroke-width="3"/>
    </g>
    <path d="M108 498h296" stroke="#0a2d36" stroke-width="22" opacity=".55"/>

    <!-- lewy klif -->
    <path d="M14 292h94l28 18 20 50 5 42-18 40-4 56H14Z" fill="url(#cliffL)"/>
    <path d="M14 292h94l18 12-42 8-70-4Z" fill="#4f7c3b"/>
    <path d="M36 292c10-10 24-10 34-2M90 292c8-8 19-8 27-1" fill="none" stroke="#6e9d4c" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#5b351c" stroke-width="4" stroke-linecap="round" opacity=".5">
      <path d="M52 330h34"/><path d="M38 368h52"/><path d="M66 404h42"/><path d="M48 446h58"/>
    </g>
    <path d="M14 292h94l28 18 8 20-42-12-88-6Z" fill="#b47b45" opacity=".5"/>

    <!-- prawy klif -->
    <path d="M498 292h-94l-28 18-20 50-5 42 18 40 4 56h125Z" fill="url(#cliffR)"/>
    <path d="M498 292h-94l-18 12 42 8 70-4Z" fill="#4f7c3b"/>
    <path d="M476 292c-10-10-24-10-34-2M422 292c-8-8-19-8-27-1" fill="none" stroke="#6e9d4c" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#5b351c" stroke-width="4" stroke-linecap="round" opacity=".5">
      <path d="M426 330h34"/><path d="M422 368h52"/><path d="M404 404h42"/><path d="M406 446h58"/>
    </g>
    <path d="M498 292h-94l-28 18-8 20 42-12 88-6Z" fill="#b47b45" opacity=".5"/>

    <!-- przyczółki -->
    <path d="M86 282h52v24H86Zm288 0h52v24h-52Z" fill="#6e7376"/>
    <path d="M86 282h52v6H86Zm288 0h52v6h-52Z" fill="#a3a8aa"/>

    <!-- kratownica -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#7d451a" stroke-width="15">
        <path d="M92 378H420"/>
        <path d="M92 306V378M174 306V378M256 306V378M338 306V378M420 306V378"/>
        <path d="M92 378 174 306M174 378 256 306M256 378 338 306M338 378 420 306"/>
      </g>
      <g stroke="url(#beam)" stroke-width="9">
        <path d="M92 378H420"/>
        <path d="M174 306V378M256 306V378M338 306V378"/>
        <path d="M92 378 174 306M174 378 256 306M256 378 338 306M338 378 420 306"/>
      </g>
      <g stroke="url(#steel)" stroke-width="9">
        <path d="M92 306V378M420 306V378"/>
      </g>
      <g fill="#ffd98a" stroke="#7d451a" stroke-width="3">
        <circle cx="92" cy="378" r="6"/><circle cx="174" cy="378" r="6"/>
        <circle cx="256" cy="378" r="6"/><circle cx="338" cy="378" r="6"/>
        <circle cx="420" cy="378" r="6"/>
        <circle cx="174" cy="306" r="6"/><circle cx="256" cy="306" r="6"/><circle cx="338" cy="306" r="6"/>
      </g>
    </g>

    <!-- pomost -->
    <rect x="82" y="292" width="348" height="16" rx="4" fill="url(#deck)"/>
    <path d="M86 294h340" stroke="#8b969d" stroke-width="2" opacity=".65"/>
    <path d="M100 300h42M164 300h42M228 300h42M292 300h42M356 300h42"
          stroke="#ffcf6a" stroke-width="3" stroke-linecap="round" opacity=".9"/>

    <!-- ciężarówka -->
    <g>
      <rect x="218" y="246" width="72" height="42" rx="5" fill="url(#truck)" stroke="#7c5017" stroke-width="3"/>
      <path d="M290 258h28l14 16v14h-42Z" fill="url(#truck)" stroke="#7c5017" stroke-width="3"/>
      <path d="M297 263h14l9 10h-23Z" fill="#a9d9e8" stroke="#4c6f7d" stroke-width="2"/>
      <path d="M218 270h114" stroke="#a56a1d" stroke-width="3" opacity=".5"/>
      <rect x="214" y="286" width="121" height="8" rx="3" fill="#283238"/>
      <circle cx="238" cy="288" r="11" fill="#151c21" stroke="#63727a" stroke-width="3"/>
      <circle cx="238" cy="288" r="4" fill="#c5d0d6"/>
      <circle cx="308" cy="288" r="11" fill="#151c21" stroke="#63727a" stroke-width="3"/>
      <circle cx="308" cy="288" r="4" fill="#c5d0d6"/>
      <rect x="226" y="252" width="20" height="10" rx="2" fill="#fff4c9" opacity=".55"/>
    </g>

    <rect x="14" y="14" width="484" height="484" fill="url(#vignette)"/>
  </g>

  <rect x="7" y="7" width="498" height="498" rx="99" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="3"/>
  <rect x="14" y="14" width="484" height="484" rx="94" fill="none" stroke="#000000" stroke-opacity=".25" stroke-width="2"/>
</svg>
