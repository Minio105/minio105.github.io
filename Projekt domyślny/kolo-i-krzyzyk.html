<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kółko i krzyżyk — Ty vs Bot AI</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel-2: #1d2430;
    --line: #2a3444;
    --text: #e6ecf3;
    --muted: #8b98a8;
    --x: #4da3ff;
    --o: #ff6b6b;
    --accent: #4da3ff;
    --win: #3ddc84;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 50% -10%, #1b2431 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 20px;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    width: 100%;
    max-width: 500px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  /* ---------- Tryby ---------- */
  .modes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px;
  }
  .modes button {
    flex: 1 1 28%;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 9px 4px;
    border-radius: 7px;
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .modes button:hover { color: var(--text); }
  .modes button.active { background: var(--accent); color: #08111d; font-weight: 600; }
  .modes button.active.hard { background: #ffb020; }
  .modes button.active.expert { background: #ff7a3d; }
  .modes button.active.insane { background: #ff4d4d; }

  .modeinfo {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin: -6px 0 12px;
    min-height: 16px;
  }

  /* ---------- Kto zaczyna ---------- */
  .startopts {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { display: none; }
  .track {
    width: 40px; height: 22px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    position: relative;
    transition: background .15s;
  }
  .track::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform .15s, background .15s;
  }
  .switch input:checked + .track { background: rgba(77,163,255,.25); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(18px); background: var(--accent); }

  /* ---------- Plansza ---------- */
  #board {
    --fs: clamp(38px, 13vw, 62px);
    --gap: 10px;
    display: grid;
    grid-template-columns: repeat(var(--n, 3), 1fr);
    gap: var(--gap);
    aspect-ratio: 1 / 1;
    margin-bottom: 14px;
  }
  .cell {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--fs);
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    color: transparent;
    transition: background .12s, border-color .12s, transform .06s;
  }
  .cell:hover:not(.taken) { background: #24303f; border-color: #3a4a5f; }
  .cell:active:not(.taken) { transform: scale(.97); }
  .cell.taken, #board.locked .cell { cursor: default; }
  #board.locked .cell:hover { background: var(--panel-2); border-color: var(--line); }
  #board.locked .cell:active { transform: none; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.appear { animation: pop .18s ease-out; }
  .cell.win {
    background: rgba(61,220,132,.14);
    border-color: var(--win);
    color: var(--win);
  }
  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ---------- Status ---------- */
  #status { text-align: center; font-size: 15px; min-height: 22px; margin-bottom: 14px; color: var(--muted); }
  #status b { color: var(--text); }
  #status.win b { color: var(--win); }
  #status.lose b { color: var(--o); }

  /* ---------- Wynik ---------- */
  .score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .score div {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    text-align: center;
  }
  .score label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .score span { font-size: 20px; font-weight: 700; }
  .score .s-x span { color: var(--x); }
  .score .s-o span { color: var(--o); }
  .score .s-d span { color: var(--muted); }

  /* ---------- Przyciski ---------- */
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 10px;
    padding: 11px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #24303f; border-color: #3a4a5f; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #08111d; }
  .btn.primary:hover { background: #63b0ff; }
</style>
</head>
<body>
<div id="app">
  <h1>Kółko i krzyżyk</h1>
  <div class="sub">Ty grasz <b style="color:var(--x)">✕</b>, bot gra <b style="color:var(--o)">◯</b>.</div>

  <div class="modes" id="modes">
    <button data-mode="easy">Łatwy</button>
    <button data-mode="medium" class="active">Średni</button>
    <button data-mode="hard">Trudny</button>
    <button data-mode="expert">Ekspert</button>
    <button data-mode="insane">Niemożliwy</button>
  </div>
  <div class="modeinfo" id="modeinfo"></div>

  <div class="startopts">
    <label class="switch">
      <input type="checkbox" id="bot-starts">
      <span class="track"></span>
    </label>
    <span>Bot zaczyna</span>
  </div>

  <div id="board"></div>

  <div id="status">Twój ruch</div>

  <div class="score">
    <div class="s-x"><label>Ty</label><span id="score-x">0</span></div>
    <div class="s-d"><label>Remisy</label><span id="score-d">0</span></div>
    <div class="s-o"><label>Bot</label><span id="score-o">0</span></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="btn-new">Nowa gra</button>
    <button class="btn" id="btn-reset">Zeruj wynik</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var HUMAN = "X";
  var BOT = "O";

  /* ---------- Tryby gry ----------
     Każdy tryb = rozmiar planszy + długość zwycięskiego rzędu + siła AI.  */
  var MODES = {
    easy:   { label: "Łatwy",      n: 3, win: 3, ai: "easy",   info: "3×3 · bot gra chaotycznie — łatwo go ograć" },
    medium: { label: "Średni",     n: 3, win: 3, ai: "medium", info: "3×3 · bot blokuje i wykorzystuje błędy" },
    hard:   { label: "Trudny",     n: 3, win: 3, ai: "perfect", info: "3×3 · pełny minimax — maksimum to remis" },
    expert: { label: "Ekspert",    n: 4, win: 4, ai: "search", info: "4×4 · 4 w rzędzie · głęboka analiza alfa-beta" },
    insane: { label: "Niemożliwy", n: 5, win: 4, ai: "search", info: "5×5 · 4 w rzędzie · do 1,2 s namysłu na ruch" }
  };

  var mode = "medium";
  var N = 3, WIN = 3, CELLS = 9, LINES = [];

  var board = [];
  var turn = HUMAN;
  var over = false;
  var locked = false;
  var botStarts = false;
  var score = { x: 0, o: 0, d: 0 };

  var boardEl = document.getElementById("board");
  var statusEl = document.getElementById("status");
  var modesEl = document.getElementById("modes");
  var modeInfoEl = document.getElementById("modeinfo");
  var botStartsEl = document.getElementById("bot-starts");
  var scoreX = document.getElementById("score-x");
  var scoreO = document.getElementById("score-o");
  var scoreD = document.getElementById("score-d");

  /* ---------- Linie zwycięstwa dla N×N i rzędu WIN ---------- */

  function buildLines(n, win) {
    var lines = [];
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        for (var d = 0; d < dirs.length; d++) {
          var dr = dirs[d][0], dc = dirs[d][1];
          var er = r + dr * (win - 1), ec = c + dc * (win - 1);
          if (er < 0 || er >= n || ec < 0 || ec >= n) { continue; }
          var line = [];
          for (var k = 0; k < win; k++) { line.push((r + dr * k) * n + (c + dc * k)); }
          lines.push(line);
        }
      }
    }
    return lines;
  }

  /* ---------- Podstawy gry ---------- */

  function other(p) { return p === "X" ? "O" : "X"; }

  function winner(b) {
    for (var i = 0; i < LINES.length; i++) {
      var l = LINES[i];
      var v = b[l[0]];
      if (!v) { continue; }
      var ok = true;
      for (var k = 1; k < l.length; k++) {
        if (b[l[k]] !== v) { ok = false; break; }
      }
      if (ok) { return { player: v, line: l }; }
    }
    return null;
  }

  function isFull(b) {
    for (var i = 0; i < b.length; i++) { if (!b[i]) { return false; } }
    return true;
  }

  function emptyCells(b) {
    var out = [];
    for (var i = 0; i < b.length; i++) { if (!b[i]) { out.push(i); } }
    return out;
  }

  // Ruch wygrywający LUB blokujący dla danego gracza (szuka 1 posunięcia).
  function findCritical(b, player) {
    var empties = emptyCells(b);
    for (var i = 0; i < empties.length; i++) {
      var idx = empties[i];
      b[idx] = player;
      var w = winner(b);
      b[idx] = "";
      if (w) { return idx; }
    }
    return -1;
  }

  function randomMove(b) {
    var empties = emptyCells(b);
    return empties[Math.floor(Math.random() * empties.length)];
  }

  /* ---------- Silnik AI: alpha-beta + heurystyka ---------- */

  var nodes = 0, deadline = 0, timeUp = false;

  function evalBoard(b) {
    var sc = 0;
    for (var i = 0; i < LINES.length; i++) {
      var line = LINES[i];
      var bot = 0, hum = 0;
      for (var k = 0; k < line.length; k++) {
        var v = b[line[k]];
        if (v === BOT) { bot++; } else if (v === HUMAN) { hum++; }
      }
      if (bot && hum) { continue; }
      if (bot) { sc += Math.pow(10, bot); }
      else if (hum) { sc -= Math.pow(10, hum) * 1.2; }
    }
    return sc;
  }

  function orderMoves(b) {
    var mid = (N - 1) / 2;
    var arr = [];
    for (var i = 0; i < b.length; i++) {
      if (b[i]) { continue; }
      var r = Math.floor(i / N), c = i % N;
      var dist = Math.abs(r - mid) + Math.abs(c - mid);
      var near = 0;
      for (var dr = -1; dr <= 1 && !near; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          var rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < N && cc >= 0 && cc < N && b[rr * N + cc]) { near = 1; break; }
        }
      }
      arr.push({ i: i, s: near * 100 - dist });
    }
    arr.sort(function (a, b2) { return b2.s - a.s; });
    var out = [];
    for (var k = 0; k < arr.length; k++) { out.push(arr[k].i); }
    return out;
  }

  function search(b, player, depth, alpha, beta, ply) {
    if (((++nodes) & 1023) === 0 && Date.now() > deadline) { timeUp = true; }
    if (timeUp) { return evalBoard(b); }

    var w = winner(b);
    if (w) { return w.player === BOT ? (100000 - ply) : (-100000 + ply); }
    if (isFull(b)) { return 0; }
    if (depth === 0) { return evalBoard(b); }

    var moves = orderMoves(b);
    var i, idx, s;

    if (player === BOT) {
      var best = -Infinity;
      for (i = 0; i < moves.length; i++) {
        idx = moves[i];
        b[idx] = BOT;
        s = search(b, HUMAN, depth - 1, alpha, beta, ply + 1);
        b[idx] = "";
        if (s > best) { best = s; }
        if (best > alpha) { alpha = best; }
        if (alpha >= beta || timeUp) { break; }
      }
      return best;
    }

    var worst = Infinity;
    for (i = 0; i < moves.length; i++) {
      idx = moves[i];
      b[idx] = HUMAN;
      s = search(b, BOT, depth - 1, alpha, beta, ply + 1);
      b[idx] = "";
      if (s < worst) { worst = s; }
      if (worst < beta) { beta = worst; }
      if (alpha >= beta || timeUp) { break; }
    }
    return worst;
  }

  function rootSearch(b, depth) {
    var moves = orderMoves(b);
    var bestScore = -Infinity, bestMove = moves[0];
    for (var i = 0; i < moves.length; i++) {
      var idx = moves[i];
      b[idx] = BOT;
      var s = search(b, HUMAN, depth - 1, -Infinity, Infinity, 1);
      b[idx] = "";
      if (timeUp) { return { move: bestMove, score: bestScore, complete: i === 0 }; }
      if (s > bestScore) { bestScore = s; bestMove = idx; }
    }
    return { move: bestMove, score: bestScore, complete: true };
  }

  function strongestMove(b, budgetMs) {
    var win = findCritical(b, BOT);
    if (win !== -1) { return win; }
    var block = findCritical(b, HUMAN);
    if (block !== -1) { return block; }

    var empties = emptyCells(b);
    if (empties.length === 0) { return -1; }

    var maxDepth = empties.length;   // pełne przeszukanie, jeśli czas pozwoli
    var best = empties[0];
    nodes = 0;
    timeUp = false;
    deadline = Date.now() + budgetMs;

    for (var d = 1; d <= maxDepth; d++) {
      var res = rootSearch(b, d);
      if (res.complete) { best = res.move; }
      if (res.complete && Math.abs(res.score) >= 90000) { break; }  // wymuszona wygrana/przegrana
      if (timeUp) { break; }
    }
    return best;
  }

  function botChoose() {
    var b = board.slice();
    if (emptyCells(b).length === 0) { return -1; }

    switch (MODES[mode].ai) {
      case "easy":
        if (Math.random() < 0.55) { return randomMove(b); }
        var w1 = findCritical(b, BOT); if (w1 !== -1) { return w1; }
        return randomMove(b);

      case "medium":
        if (Math.random() < 0.25) { return randomMove(b); }
        var w2 = findCritical(b, BOT); if (w2 !== -1) { return w2; }
        var b2 = findCritical(b, HUMAN); if (b2 !== -1) { return b2; }
        if (b[4] === "") { return 4; }
        return randomMove(b);

      case "perfect":
        return strongestMove(b, 3000);        // 3×3 → pełny minimax (niepokonany)

      default:                                // "search"
        return strongestMove(b, mode === "insane" ? 1200 : 700);
    }
  }

  /* ---------- Interfejs ---------- */

  function applyMode(m) {
    mode = m;
    var cfg = MODES[m];
    N = cfg.n;
    WIN = cfg.win;
    CELLS = N * N;
    LINES = buildLines(N, WIN);
    boardEl.style.setProperty("--n", N);
    boardEl.style.setProperty("--fs",
      N === 3 ? "clamp(38px, 13vw, 62px)" : (N === 4 ? "clamp(26px, 9vw, 42px)" : "clamp(18px, 6.5vw, 32px)"));
    boardEl.style.setProperty("--gap", N === 3 ? "10px" : (N === 4 ? "8px" : "6px"));
    modeInfoEl.textContent = cfg.info;
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    for (var i = 0; i < CELLS; i++) {
      (function (i) {
        var c = document.createElement("div");
        c.className = "cell";
        c.dataset.i = i;
        c.addEventListener("click", function () { onCellClick(i); });
        boardEl.appendChild(c);
      })(i);
    }
  }

  function render() {
    var cells = boardEl.children;
    for (var i = 0; i < CELLS; i++) {
      var c = cells[i];
      var v = board[i];
      c.textContent = v === "X" ? "✕" : (v === "O" ? "◯" : "");
      c.className = "cell" + (v ? " taken " + v.toLowerCase() : "");
    }
  }

  function highlightWin(line) {
    var cells = boardEl.children;
    for (var i = 0; i < line.length; i++) { cells[line[i]].classList.add("win"); }
  }

  function setStatus(html, cls) {
    statusEl.className = cls || "";
    statusEl.innerHTML = html;
  }

  function updateScore() {
    scoreX.textContent = score.x;
    scoreO.textContent = score.o;
    scoreD.textContent = score.d;
  }

  function place(i, player) {
    board[i] = player;
    render();
    var c = boardEl.children[i];
    c.classList.add("appear");
    setTimeout(function () { c.classList.remove("appear"); }, 200);
  }

  function finish(w) {
    over = true;
    locked = false;
    boardEl.classList.remove("locked");
    if (!w) {
      score.d++;
      setStatus("<b>Remis!</b> Nikomu się nie udało.");
      return;
    }
    highlightWin(w.line);
    if (w.player === HUMAN) {
      score.x++;
      setStatus("<b>Wygrałeś!</b> 🎉", "win");
    } else {
      score.o++;
      setStatus("<b>Bot wygrał.</b> Spróbuj jeszcze raz.", "lose");
    }
    updateScore();
  }

  function endIfDone() {
    var w = winner(board);
    if (w) { finish(w); return true; }
    if (isFull(board)) { finish(null); return true; }
    return false;
  }

  function botTurn() {
    if (over) { return; }
    locked = true;
    boardEl.classList.add("locked");
    turn = BOT;
    setStatus("Bot myśli…");

    var ai = MODES[mode].ai;
    var delay = (ai === "easy") ? 350 : (ai === "medium" ? 450 : 250);

    setTimeout(function () {
      var move = botChoose();
      if (move === -1) { return; }
      place(move, BOT);
      if (endIfDone()) { updateScore(); return; }

      locked = false;
      boardEl.classList.remove("locked");
      turn = HUMAN;
      setStatus("Twój ruch");
    }, delay);
  }

  function onCellClick(i) {
    if (over || locked || turn !== HUMAN || board[i]) { return; }
    place(i, HUMAN);
    if (endIfDone()) { updateScore(); return; }
    botTurn();
  }

  function newGame() {
    board = [];
    for (var i = 0; i < CELLS; i++) { board.push(""); }
    over = false;
    locked = false;
    boardEl.classList.remove("locked");
    buildBoard();
    render();
    updateScore();

    if (botStarts) {
      botTurn();
    } else {
      turn = HUMAN;
      setStatus("Twój ruch — zaczynasz");
    }
  }

  /* ---------- Zdarzenia ---------- */

  modesEl.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("button") : null;
    if (!btn) { return; }
    var buttons = modesEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) { buttons[i].classList.remove("active"); }
    btn.classList.add("active");
    btn.classList.add(btn.dataset.mode === "hard" ? "hard" : "");
    btn.classList.add(btn.dataset.mode === "expert" ? "expert" : "");
    btn.classList.add(btn.dataset.mode === "insane" ? "insane" : "");
    applyMode(btn.dataset.mode);
    newGame();
  });

  botStartsEl.addEventListener("change", function () {
    botStarts = botStartsEl.checked;
    newGame();
  });

  document.getElementById("btn-new").addEventListener("click", newGame);

  document.getElementById("btn-reset").addEventListener("click", function () {
    score = { x: 0, o: 0, d: 0 };
    newGame();
  });

  /* ---------- Start ---------- */
  applyMode(mode);
  newGame();

  /* ---------- Hook debugowy (konsola: KiK.*) ---------- */
  window.KiK = {
    setMode: applyMode,
    botMove: function (b) {
      var saved = board;
      board = b.slice();
      var m = botChoose();
      board = saved;
      return m;
    },
    winner: winner,
    isFull: isFull
  };
})();
</script>
</body>
</html>
