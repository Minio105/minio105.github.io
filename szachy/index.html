<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Szachy — zagraj z AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">♞</div>
      <div class="brand-text">
        <h1>Szachy</h1>
        <p>Partia przeciwko silnikowi AI — 6 poziomów trudności</p>
      </div>
    </div>
    <button class="icon-btn" id="soundBtn" title="Dźwięk: włączony" aria-label="Włącz lub wyłącz dźwięk">🔊</button>
  </header>

  <main class="layout">
    <section class="board-column">
      <div class="player-bar">
        <div class="avatar ai" id="avatarTop">🤖</div>
        <div class="player-info">
          <div class="player-name">
            <span id="nameTop">Silnik AI</span>
            <span class="badge" id="levelBadgeTop">Średni</span>
          </div>
          <div class="captured" id="capturedTop"></div>
        </div>
        <div class="material" id="materialTop"></div>
      </div>

      <div class="board-frame">
        <div class="board" id="board" role="grid" aria-label="Szachownica"></div>
      </div>

      <div class="player-bar">
        <div class="avatar" id="avatarBottom">🙂</div>
        <div class="player-info">
          <div class="player-name">
            <span>Ty</span>
            <span class="badge" id="sideBadge">białe</span>
          </div>
          <div class="captured" id="capturedBottom"></div>
        </div>
        <div class="material" id="materialBottom"></div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="card status-card">
        <span class="status-dot" id="statusDot"></span>
        <div>
          <div class="status-title" id="statusTitle">Twój ruch</div>
          <div class="status-sub" id="statusSub">Wybierz figurę i wskaż pole</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Poziom AI</h2>
          <span class="muted" id="levelRating">~1200</span>
        </div>
        <div class="levels" id="levelList"></div>
      </div>

      <div class="card actions">
        <button class="btn primary" id="newBtn">Nowa partia</button>
        <div class="btn-row">
          <button class="btn" id="undoBtn">Cofnij</button>
          <button class="btn" id="hintBtn">Podpowiedź</button>
          <button class="btn" id="flipBtn">Obróć</button>
        </div>
      </div>

      <div class="card history-card">
        <div class="card-head"><h2>Przebieg partii</h2></div>
        <div class="moves" id="moves">
          <div class="moves-empty">Ruchy pojawią się tutaj.</div>
        </div>
      </div>
    </aside>
  </main>
</div>

<!-- start / nowa partia -->
<div class="overlay" id="startOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-mark">♞</div>
      <h2>Nowa partia</h2>
      <p>Wybierz kolor i poziom trudności przeciwnika.</p>
    </div>
    <div class="field">
      <label>Twój kolor</label>
      <div class="segmented" id="colorChoices">
        <button type="button" data-color="w" class="active">♔ Białe</button>
        <button type="button" data-color="b">♚ Czarne</button>
        <button type="button" data-color="r">🎲 Losowo</button>
      </div>
    </div>
    <div class="field">
      <label>Poziom AI</label>
      <div class="levels" id="startLevels"></div>
    </div>
    <button class="btn primary big" id="startBtn">Rozpocznij grę</button>
  </div>
</div>

<!-- koniec partii -->
<div class="overlay hidden" id="resultOverlay">
  <div class="modal small">
    <div class="result-icon" id="resultIcon">🏆</div>
    <h2 id="resultTitle">Zwycięstwo!</h2>
    <p id="resultSub">Szach mat</p>
    <div class="modal-actions">
      <button class="btn primary" id="againBtn">Nowa partia</button>
      <button class="btn" id="reviewBtn">Zamknij</button>
    </div>
  </div>
</div>

<!-- wybór figury przy promocji -->
<div class="overlay hidden" id="promoOverlay">
  <div class="modal promo-card">
    <h3>Wybierz figurę</h3>
    <div class="promo-options" id="promoOptions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
