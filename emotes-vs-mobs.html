<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Emotes vs Mobs — obrona domu (styl PvZ)</title>
<!--
  ============================================================================
  EMOTES vs MOBS — strategia / lane defense (styl Plants vs Zombies)
  Plik samodzielny: bez internetu, bez zależności. Wystarczy otworzyć w przeglądarce.
  ----------------------------------------------------------------------------
  Cel: moby idą pasami z prawej strony do Twojego domu. Stawiaj emote'y na trawie,
  zbieraj złoto, ulepszaj drużynę i nie pozwól, żeby cokolwiek dotarło do domu.
  ============================================================================
-->
<style>
*{box-sizing:border-box}
:root{
  --bg:#05070d; --panel:#0d1421; --line:#22304f; --line2:#2f4266;
  --txt:#eaeffb; --dim:#8494b5; --dim2:#5d6b8a;
  --ac:#ffb02e; --gold:#ffd166; --bad:#ff5d5d; --ok:#3ddc84;
  --wood:#8f6f43; --wood2:#5f4a28; --paper:#f6e9cd;
}
html,body{height:100%}
body{
  margin:0;color:var(--txt);min-height:100%;
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 6% -10%, #16213c 0%, transparent 60%),
    radial-gradient(900px 620px at 96% 2%, #17240f 0%, transparent 58%),
    linear-gradient(180deg,#05070d,#04060b);
}
button{font:inherit}
.hidden{display:none !important}

/* ------------------------------- HUD ---------------------------------- */
#hud{
  position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px 16px;
  align-items:center;justify-content:space-between;padding:9px 14px;
  background:linear-gradient(180deg,rgba(15,23,38,.97),rgba(9,16,27,.94));
  border-bottom:1px solid var(--line);backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;letter-spacing:-.2px}
.brand .m{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(160deg,#ffd166,#ff8a1e 62%,#e06a08);
  box-shadow:0 10px 22px -12px #ff8a1e, inset 0 1px 0 rgba(255,255,255,.5)}
.brand small{display:block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{min-width:74px;padding:4px 11px;border-radius:12px;background:#0a1220;border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:16px;font-weight:900;line-height:1.25}
.stat span{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
.stat.gold b{color:var(--gold)}
.stat.lives b{color:var(--ok)}
.stat.lives.low b{color:var(--bad)}
.stat.wave b{color:#8fb8ff}
.stat.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
.ctrls{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:11px;cursor:pointer;
  font-size:12.5px;font-weight:800;color:var(--txt);background:#0e1626;border:1px solid var(--line);
  transition:background .15s,border-color .15s,transform .12s,color .15s}
.btn:hover{background:#131f33;border-color:var(--line2)}
.btn:active{transform:scale(.97)}
.btn.on{border-color:var(--ac);color:#ffe0ac;background:rgba(255,176,46,.12)}
.btn.go{
  color:#20150a;border:0;background:linear-gradient(180deg,#ffe08a,#ffb02e 58%,#d98f14);
  box-shadow:0 10px 22px -12px var(--ac), inset 0 1px 0 rgba(255,255,255,.5)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* --------------------------- ikony --------------------------- */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{
  width:1em;height:1em;display:inline-block;vertical-align:-.16em;flex:none;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  pointer-events:none}
.ic.dim{opacity:.7}
.cico{display:block;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.cico.sm{filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.stat span .ic{opacity:.85;margin-right:1px}

/* ---------------------------- układ gry ---------------------------- */
#app{max-width:1260px;margin:0 auto;padding:10px 14px 16px;display:flex;flex-direction:column;gap:9px}

/* pasek kart („paczuszki nasion”) */
#cards{
  display:flex;gap:6px;padding:8px;border-radius:14px;overflow-x:auto;
  background:linear-gradient(180deg,var(--wood),var(--wood2));
  border:1px solid #41331f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 18px 32px -24px #000}
#cards::-webkit-scrollbar{height:8px}
#cards::-webkit-scrollbar-thumb{background:#4a3a20;border-radius:9px}
.card{
  position:relative;flex:0 0 88px;padding:5px 5px 4px;border-radius:10px;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,#fdf3dc,var(--paper) 60%,#e0cda4);
  border:2px solid #8a7444;color:#3b2f14;text-align:center;
  transition:transform .12s,box-shadow .15s,filter .15s;
  box-shadow:inset 0 1px 0 #fff, 0 6px 12px -8px #000}
.card:hover{transform:translateY(-2px)}
.card .e{display:grid;place-items:center;height:31px}.card .e .cico{margin:0 auto}
.card .n{display:block;font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c{display:block;font-size:11.5px;font-weight:900;color:#7a5a10}
.card .k{position:absolute;top:3px;left:4px;font-size:9px;font-weight:900;color:#a08c5e}
.card .cd{position:absolute;left:0;right:0;top:0;height:0%;
  background:rgba(8,12,18,.66);pointer-events:none;transition:height .12s linear}
.card.armed{outline:3px solid #ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.35), 0 12px 22px -14px #ffb02e}
.card.dis{filter:grayscale(.75) brightness(.86);cursor:not-allowed}
.card.dis:hover{transform:none}
.card .hp{position:absolute;right:4px;top:4px;font-size:9px;font-weight:900;color:#8a6a1e}

/* scena */
#stage{position:relative}
canvas{width:100%;height:auto;display:block;border-radius:14px;border:1px solid #26361c;
  background:#3f8a24;box-shadow:0 28px 60px -42px #000;cursor:pointer;touch-action:manipulation}

/* panel zaznaczonego emote’a */
#selpanel{
  position:absolute;left:10px;bottom:10px;z-index:12;width:264px;padding:10px;border-radius:14px;
  background:linear-gradient(180deg,rgba(15,24,40,.96),rgba(8,13,22,.97));
  border:1px solid var(--line2);box-shadow:0 24px 44px -30px #000}
#selpanel .top{display:flex;align-items:center;gap:9px}
#selpanel .top .e{font-size:30px;line-height:1}
#selpanel .top .nm{font-weight:900;font-size:14.5px}
#selpanel .top .lv{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--dim);text-transform:uppercase}
#selpanel p{margin:7px 0;font-size:12px;color:var(--dim)}
#selpanel .rows{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
#selpanel .rows span{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;
  background:#0e1626;border:1px solid rgba(255,255,255,.07);color:var(--dim)}
#selpanel .rows span b{color:var(--txt)}
#selpanel .acts{display:flex;gap:6px}
#selpanel .acts .btn{flex:1;justify-content:center}

/* --------------------------- dolny pasek --------------------------- */
#bottom{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.progwrap{flex:1 1 300px;min-width:230px}
.progtop{display:flex;align-items:baseline;gap:9px;margin-bottom:5px;font-size:12.5px;color:var(--dim)}
.progtop b{color:var(--txt);font-size:14px;font-weight:900}
.progtop .flag{color:#ffd166;font-weight:900}
.prog{position:relative;height:19px;border-radius:99px;background:#0b1322;border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#3ddc84,#a8e05f 70%,#ffd166);transition:width .25s}
.prog b{position:absolute;right:9px;top:0;line-height:19px;font-size:11px;color:#0b2214;font-weight:900}
.botright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.auto{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
#log{display:flex;flex-direction:column;gap:4px;max-height:66px;overflow:auto;font-size:12px}
#log div{padding:4px 9px;border-radius:9px;background:#0b1322;border:1px solid rgba(255,255,255,.05);color:var(--dim)}
#log div b{color:var(--txt)}
#log div.warn{border-color:rgba(255,93,93,.4);color:#ffc0c0}
#log div.good{border-color:rgba(61,220,132,.35);color:#b7f5d0}
#log div.gold{border-color:rgba(255,209,102,.35);color:#ffe6ae}

/* --------------------------- nakładki --------------------------- */
.overlay{
  position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;
  border-radius:14px;background:rgba(4,7,13,.8);backdrop-filter:blur(4px);animation:fade .25s}
.overlay .box{
  width:100%;max-width:540px;max-height:100%;overflow:auto;text-align:center;
  background:linear-gradient(180deg,#131c30,#0a1120);border:1px solid var(--line2);
  border-radius:18px;padding:20px;box-shadow:0 40px 80px -40px #000}
.overlay h2{margin:0 0 4px;font-size:23px;font-weight:900;letter-spacing:-.4px}
.overlay p{margin:6px 0 0;color:var(--dim);font-size:13.5px}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.diffs button{padding:10px 6px;border-radius:12px;cursor:pointer;color:var(--dim);
  background:#0e1626;border:1px solid var(--line);font-weight:800;font-size:13px;transition:.15s}
.diffs button:hover{color:var(--txt);border-color:var(--line2);transform:translateY(-1px)}
.diffs button.on{background:rgba(255,176,46,.14);border-color:var(--ac);color:#ffe0ac;
  box-shadow:inset 0 0 0 1px rgba(255,176,46,.3)}
.diffs button small{display:block;font-size:10.5px;font-weight:700;color:var(--dim2);margin-top:3px}
.diffs button.on small{color:#e8c48a}
.rules{text-align:left;font-size:12.5px;color:var(--dim);background:#0b1322;border:1px solid rgba(255,255,255,.06);
  border-radius:12px;padding:10px 12px;margin:0 0 13px}
.rules b{color:var(--txt)}
.rules ul{margin:6px 0 0;padding-left:18px}
.rules li{margin:3px 0}
.summary{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:13px 0}
.summary span{padding:8px 12px;border-radius:11px;background:#0b1322;border:1px solid var(--line);font-size:12.5px;font-weight:800}
.summary span b{display:block;font-size:18px;color:var(--gold)}

/* ------------------------- menu / pauza / koniec ------------------------- */
.overlay .box.menu{max-width:548px;padding:24px 22px 20px;position:relative;overflow:hidden;
  background:radial-gradient(560px 260px at 50% -12%, rgba(61,220,132,.20), transparent 72%),
             linear-gradient(180deg,#15203a,#080e1b)}
.box.menu::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg, rgba(87,165,48,.16) 0 14px, rgba(77,151,39,.16) 14px 28px);
  -webkit-mask-image:linear-gradient(180deg,transparent 52%,#000);mask-image:linear-gradient(180deg,transparent 52%,#000)}
.box.menu > *{position:relative;z-index:1}
.logo{display:flex;flex-direction:column;align-items:center}
.logo .mark{font-size:54px;line-height:1;animation:float 3.6s ease-in-out infinite;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.logo h2{margin:8px 0 0;font-size:33px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(180deg,#fff,#ffd166 62%,#ff9f1e);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 5px 12px rgba(0,0,0,.55))}
.logo p{margin:8px 0 0;max-width:440px;font-size:13.5px;color:var(--dim)}
.march{position:relative;height:62px;margin:15px 0 2px;border-radius:14px;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  background:repeating-linear-gradient(180deg,#4f9a2c 0 21px,#469125 21px 42px);
  box-shadow:inset 0 0 26px rgba(0,0,0,.45), 0 14px 26px -20px #000}
.march .u{position:absolute;left:0;top:50%;margin-top:-17px;line-height:1}
.march .e{animation:marchR 13s linear infinite}
.march .m{animation:marchL 15s linear infinite}
.march .s1{animation-delay:-3.4s}
.march .s2{animation-delay:-7.2s}
.march .s3{animation-delay:-10.6s}
@keyframes marchL{from{transform:translateX(620px)}to{transform:translateX(-70px)}}
@keyframes marchR{from{transform:translateX(-70px)}to{transform:translateX(620px)}}
.march .vsi{position:absolute;left:50%;top:50%;width:40px;margin:-13px 0 0 -20px;text-align:center;
  font-size:11px;font-weight:900;letter-spacing:1px;color:#fff;padding:4px 0;border-radius:99px;
  background:rgba(5,8,14,.6);text-shadow:0 2px 6px rgba(0,0,0,.7)}
.big{display:block;width:100%;margin:15px 0 2px;padding:16px;border:0;border-radius:15px;cursor:pointer;
  font-size:19px;font-weight:900;letter-spacing:.6px;color:#2b1a04;
  background:linear-gradient(180deg,#ffe488,#ffb02e 56%,#d8890f);
  box-shadow:0 18px 34px -16px rgba(255,176,46,.8), inset 0 1px 0 rgba(255,255,255,.65);
  transition:transform .12s, filter .15s}
.big:hover{filter:brightness(1.06);transform:translateY(-1px)}
.big:active{transform:scale(.985)}
.menu-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.menu-row .btn{flex:1 1 130px;justify-content:center}
.rec{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.rec span{font-size:12px;font-weight:800;color:#ffe0ac;padding:6px 13px;border-radius:99px;
  background:rgba(255,176,46,.12);border:1px solid rgba(255,176,46,.32)}
.menu-foot{margin:13px 0 0;font-size:11.5px;color:var(--dim2);line-height:1.7}
.menu-foot kbd{font:inherit;font-weight:900;color:#cfd9f5;background:#131f33;border:1px solid var(--line);
  border-radius:6px;padding:1px 5px}
.overlay.pause{background:rgba(4,7,13,.58)}
.overlay .box.pause{max-width:420px;padding:22px}
.overlay .box.pause .mark{font-size:40px;line-height:1;display:block;
  animation:float 3.6s ease-in-out infinite}
.overlay .box.pause h2{font-size:24px;margin-top:6px}
.infoline{margin:10px 0 0;font-size:13px;color:var(--dim)}
.infoline b{color:var(--txt)}
.rowlabel{margin:14px 0 6px;font-size:10.5px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--dim2);text-align:left}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes button{padding:10px 8px;border-radius:12px;cursor:pointer;color:var(--dim);background:#0e1626;
  border:1px solid var(--line);font-weight:800;font-size:13px;transition:.15s}
.modes button:hover{color:var(--txt);border-color:var(--line2);transform:translateY(-1px)}
.modes button.on{background:rgba(61,220,132,.14);border-color:var(--ok);color:#bff5d6;
  box-shadow:inset 0 0 0 1px rgba(61,220,132,.28)}
.modes button small{display:block;font-size:10.5px;font-weight:700;color:var(--dim2);margin-top:3px}
.modes button.on small{color:#a9e8c6}
.board{margin-top:14px;text-align:left;background:#0b1322;border:1px solid rgba(255,255,255,.06);
  border-radius:12px;padding:10px 12px}
.board > b{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim2)}
.board ul{list-style:none;margin:7px 0 0;padding:0;font-size:12.5px;color:var(--dim)}
.board li{display:flex;align-items:center;gap:8px;padding:4px 0 4px;border-top:1px dashed rgba(255,255,255,.07)}
.board li:first-child{border-top:0}
.board li b{color:var(--txt)}
.board li i{font-style:normal;color:var(--dim2);font-size:11px;margin-left:auto}
.board .p{font-weight:900;color:var(--dim2);min-width:22px}
.board .p1{color:#ffd166}
.board .p2{color:#cfd9f5}
.board .p3{color:#d9a066}
.board .empty{margin:6px 0 0;font-size:12.5px;color:var(--dim2)}
.stat.sand{padding:4px 9px;background:rgba(167,139,250,.13);border-color:rgba(167,139,250,.4)}
.stat.sand b{color:#c7b3ff;font-size:13px}
.stat.sand span{color:#a697d8}

/* --------------------------- toasty --------------------------- */
#toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
#toasts div{padding:7px 15px;border-radius:99px;font-size:13px;font-weight:800;color:var(--txt);
  background:rgba(9,16,27,.94);border:1px solid var(--line2);box-shadow:0 16px 34px -18px #000;
  animation:tin .25s backwards}
#toasts div.good{border-color:rgba(61,220,132,.5);color:#b7f5d0}
#toasts div.warn{border-color:rgba(255,93,93,.5);color:#ffc0c0}
#toasts div.gold{border-color:rgba(255,209,102,.5);color:#ffe6ae}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:820px){
  .brand small{display:none}
  .stat{min-width:60px;padding:3px 8px}
  .stat b{font-size:14px}
  .card{flex:0 0 74px}
  .card .e{height:26px}
  #selpanel{width:230px}
}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19.5 12z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.6v12.8M15 5.6v12.8" stroke-width="2.8"/></symbol>
<symbol id="i-speed" viewBox="0 0 24 24"><path d="M4.5 6.5 10 12l-5.5 5.5"/><path d="M12.5 6.5 18 12l-5.5 5.5"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-restart" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.2 3.6v5h-5"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7.4C10.4 6 8.3 5.3 6 5.3H4v13h2c2.2 0 4.3.7 6 2 1.7-1.3 3.8-2 6-2h2v-13h-2c-2.3 0-4.4.7-6 2.1z"/><path d="M12 7.4v12.9"/></symbol>
<symbol id="i-volOn" viewBox="0 0 24 24"><path d="M11 5.6 7 9.2H4.2v5.6H7l4 3.6z"/><path d="M14.8 9.8a3.4 3.4 0 0 1 0 4.4M17.6 7.2a7 7 0 0 1 0 9.6"/></symbol>
<symbol id="i-volOff" viewBox="0 0 24 24"><path d="M11 5.6 7 9.2H4.2v5.6H7l4 3.6z"/><path d="M15.4 10.2l5 4M20.4 10.2l-5 4"/></symbol>
<symbol id="i-burst" viewBox="0 0 24 24"><path d="M12 2.8l2.2 4.8 4.9-1.2-1.2 4.9 4.7 2.3-4.7 2.3 1.2 4.9-4.9-1.2L12 21.4l-2.2-4.8-4.9 1.2 1.2-4.9L1.4 10.6l4.7-2.3L4.9 3.4l4.9 1.2z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2v9.6M14.8 9.4c-.6-.8-1.7-1.3-2.8-1.3-1.4 0-2.5.7-2.5 1.8s1.1 1.6 2.5 1.9c1.6.3 2.6.9 2.6 2.1s-1.2 1.9-2.6 1.9c-1.2 0-2.3-.5-2.9-1.4"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.4S4.4 15.6 4.4 10.4A4 4 0 0 1 12 8a4 4 0 0 1 7.6 2.4c0 5.2-7.6 10-7.6 10z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 3.6v17"/><path d="M6 4.6h11.4l-2.3 3.6 2.3 3.6H6z"/></symbol>

function rowAt(y){ return Math.floor((y - Y0)/CH); }

var OUT = "#18212e";                       /* wspólny kontur */

function ciw(inner) {                      /* samodzielny dokument SVG 64×64 */
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">' + inner + "</svg>";
}
function headC(cx, cy, r, fill) {
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'" stroke="'+OUT+'" stroke-width="2.6"/>';
}
function eyesO(cx1, cx2, cy, r, dr, pupil, sclera) {
  pupil = pupil || OUT; sclera = sclera || "#fff";
  return '<circle cx="'+cx1+'" cy="'+cy+'" r="'+r+'" fill="'+sclera+'" stroke="'+pupil+'" stroke-width="1.6"/>' +

         '<circle cx="'+(cx1+dr)+'" cy="'+cy+'" r="'+(r*0.46).toFixed(2)+'" fill="'+pupil+'"/>' +
         '<circle cx="'+(cx2+dr)+'" cy="'+cy+'" r="'+(r*0.46).toFixed(2)+'" fill="'+pupil+'"/>';
}
function arcP(d, w, col, fill) {
  return '<path d="'+d+'" fill="'+(fill||"none")+'" stroke="'+(col||OUT)+'" stroke-width="'+(w||3)+'"' +
         ' stroke-linecap="round" stroke-linejoin="round"/>';
}
function spark(cx, cy, r, col, w) {
  var s = "", i, a;
  for (i = 0; i < 3; i++) {
    a = i * Math.PI/3;
    s += '<path d="M'+(cx-r*Math.cos(a)).toFixed(1)+' '+(cy-r*Math.sin(a)).toFixed(1)+'L'+
         (cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)+
         '" stroke="'+(col||"#cdeeff")+'" stroke-width="'+(w||2)+'" stroke-linecap="round"/>';
  }
  return s;
}
function rays(cx, cy, r1, r2, n, col, w) {
  var s = "", i, a;
  for (i = 0; i < n; i++) {
    a = i * 2*Math.PI/n;
    s += '<path d="M'+(cx+r1*Math.cos(a)).toFixed(1)+' '+(cy+r1*Math.sin(a)).toFixed(1)+'L'+
         (cx+r2*Math.cos(a)).toFixed(1)+' '+(cy+r2*Math.sin(a)).toFixed(1)+
         '" stroke="'+col+'" stroke-width="'+(w||3.4)+'" stroke-linecap="round"/>';

  return s;
}

var CHAR_SVG = {};
function charSVG(key) {
  if (CHAR_SVG[key] === undefined) CHAR_SVG[key] = CHARS[key] ? ciw(CHARS[key]()) : "";

}
function charInline(key, size, cls) {
  var s = charSVG(key);
  if (!s) return "";
  return s.replace("<svg ", '<svg class="cico' + (cls ? " " + cls : "") +
    '" style="width:' + size + "px;height:" + size + 'px" ');
}
function ic(name, size) {
  return '<svg class="ic" style="width:' + (size || 15) + 'px;height:' + (size || 15) + 'px"' +
         ' aria-hidden="true"><use href="#i-' + name + '"/></svg>';
}
function setUse(node, name) {
  if (!node) return;
  var u = node.querySelector("use");
  if (u) u.setAttribute("href", "#i-" + name);
}
/* zamienia znaczniki <i data-i="…"> w statycznym HTML na ikony */
function paintStaticIcons(root) {
  var nodes = (root || document).querySelectorAll("[data-i]");
  var list = [], i;
  for (i = 0; i < nodes.length; i++) list.push(nodes[i]);
  for (i = 0; i < list.length; i++) {
    var n = list[i];
    n.outerHTML = ic(n.getAttribute("data-i"), parseInt(n.getAttribute("data-s") || "15", 10));
  }
}

function buildIcons() {
  for (var k in CHARS) {

function puff(x, y, r, n, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 0.55 : alpha;
  ctx.fillStyle = "#fff";

    ctx.beginPath();
    ctx.arc(x - i*r*1.05, y - i*r*0.3, r*(1 - i*0.16), 0, Math.PI*2);

var AC = null;
function beep(freq, dur, type, vol) {
  if (!state.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    o.connect(g); g.connect(AC.destination);
    var t = AC.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function toasty(msg, cls) {
  if (!el.toasts) return;
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.innerHTML = iconify(msg);
  el.toasts.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 2400);
}
function log(msg, cls) {
  if (!el.log) return;
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.innerHTML = iconify(msg);
  el.log.insertBefore(d, el.log.firstChild);
  while (el.log.childNodes.length > 26) el.log.removeChild(el.log.lastChild);
}

    var sc = localStorage.getItem("evm.scores");
    if (sc) { var arr = JSON.parse(sc); if (arr && arr.length) state.scores = arr.slice(0, 5); }
    var pr = localStorage.getItem("evm.prefs");
    if (pr) {
      var p = JSON.parse(pr);

      if (p.mode === "sandbox") state.mode = "sandbox";
    }

}

}
function saveBest() {
  if (state.sandbox) return;             /* sandbox nie psuje rekordów */
  try {
    if (state.wave > state.best || state.score > state.bestScore) {
      state.best = Math.max(state.best, state.wave);
      state.bestScore = Math.max(state.bestScore, state.score);
      localStorage.setItem("evm.best", JSON.stringify({ wave:state.best, score:state.bestScore }));
    }
  } catch (e) {}
}
/* wpis do tablicy wyników (tryb sandbox nie trafia do rankingu) */
function saveScore() {
  if (state.sandbox || state.runSaved || state.wave < 1) return;
  state.runSaved = true;
  var entry = { w:state.wave, s:state.score, d:DIFF[state.diff].name, t:Date.now() };
  state.scores.push(entry);
  state.scores.sort(function(a, b){ return (b.w - a.w) || (b.s - a.s); });
  state.scores = state.scores.slice(0, 5);
  state.newRecord = (state.scores.indexOf(entry) === 0);
  try { localStorage.setItem("evm.scores", JSON.stringify(state.scores)); } catch (e) {}
}

/* =========================================================================
   7. FALE — skład i skalowanie trudności
   ========================================================================= */
function hpMul(n) { return (1 + 0.16*(n-1) + 0.006*(n-1)*(n-1)) * DIFF[state.diff].hp; }
function goldOf(base, n) { return Math.max(1, Math.round(base * (1 + 0.05*(n-1)) * DIFF[state.diff].reward)); }
/* ekonomia — w trybie sandbox złoto jest nieskończone */
function canAfford(cost) { return state.sandbox || state.gold >= cost; }
function spendGold(cost) { if (!state.sandbox) state.gold -= cost; }
function gainGold(v)     { if (!state.sandbox) state.gold += v; }

function buildWave(n) {
  var pool = [
    { t:"zombie",    cost:2.0, from:1 },
    { t:"kosmita",   cost:2.4, from:2 },
    { t:"dzik",      cost:3.4, from:3 },
    { t:"nietoperz", cost:3.0, from:4 },
    { t:"slimak",    cost:4.2, from:6 },
    { t:"troll",     cost:4.4, from:8 }
  ].filter(function(p){ return n >= p.from; });

  var budget = (5 + 2.3*n) * DIFF[state.diff].budget;
  var picks = [], guard = 0;
  while (budget > 1.2 && guard++ < 400) {
    var p = pool[Math.floor(Math.random()*pool.length)];
    if (p.cost > budget) {
      if (picks.length >= 3) break;
      var cheap = pool.slice().sort(function(a,b){ return a.cost - b.cost; })[0];
      picks.push(cheap.t); budget -= cheap.cost; continue;
    }
    picks.push(p.t); budget -= p.cost;
    if (picks.length >= 28) break;
  }
  var counts = {};
  picks.forEach(function(t){ counts[t] = (counts[t]||0) + 1; });
  var q = [], t0 = 0.6;
  Object.keys(counts).forEach(function(t){
    for (var i = 0; i < counts[t]; i++) q.push({ type:t, at:t0 + i*0.9 });
    t0 += counts[t]*0.9 + 2.2;
  });
  if (n % 5 === 0) q.push({ type:(n % 10 === 0 ? "smok" : "ogr"), at:0.8 });
  q.sort(function(a,b){ return a.at - b.at; });
  return q;
}
function pickRow() {
  var counts = [0,0,0,0,0], i;
  for (i = 0; i < state.mobs.length; i++) counts[state.mobs[i].row]++;
  /* na początku moby wchodzą tylko kilkoma pasami — dopiero później atakują wszystkie */
  var maxRows = Math.min(ROWS, 1 + Math.floor(state.wave / 2));
  var used = 0;
  for (i = 0; i < ROWS; i++) if (counts[i] > 0) used++;
  var cand = [], min = Infinity;
  for (i = 0; i < ROWS; i++) {
    if (counts[i] === 0 && used >= maxRows) continue;
    if (counts[i] < min) { min = counts[i]; cand = [i]; }
    else if (counts[i] === min) cand.push(i);
  }
  return cand[Math.floor(Math.random()*cand.length)];
}
function spawnMob(type) {
  var def = MOBS[type], n = state.wave, row = pickRow();
  var hp = Math.round(def.hp * hpMul(n));
  var m = {
    type:type, def:def, name:def.name, emoji:def.emoji, row:row,
    x: W + 12 + Math.random()*46, y: cellY(row), r:def.r, size:def.size,
    hp:hp, maxHp:hp, speed:def.speed, armor:def.armor || 0, eat:def.eat || 0,
    gold:goldOf(def.gold, n), score:Math.round(def.hp*0.12) + (def.boss ? 400 : 0),
    leak:def.leak || 1, boss:!!def.boss, fly:!!def.fly, regen:def.regen || 0,
    slowT:0, slowF:0, stunT:0, hitT:0, eating:null, dead:false, seed:Math.random()*6.28, bob:0
  };
  state.mobs.push(m);
  if (def.boss) { toasty("🚩 " + charInline(type, 17, "sm") + " " + def.name + " nadchodzi!", "warn"); beep(90, 0.6, "sawtooth", 0.07); }
}
function startWave() {
  if (state.phase !== "idle") return;
  state.wave++;
  if (!state.plan.length) state.plan = buildWave(state.wave);
  state.spawnI = 0; state.waveTime = 0; state.waveKilled = 0;
  state.totalSpawned = state.plan.length;
  state.phase = "running";
  if (state.wave % 5 === 0) { toasty("🚩 Fala bossa!", "warn"); log("<b>🚩 Fala " + state.wave + " — BOSS!</b>", "warn"); }
  else { toasty("▶ Fala " + state.wave + "!", "gold"); log("<b>Fala " + state.wave + "</b> — start!", "gold"); }
  beep(520, 0.12, "square", 0.05); setTimeout(function(){ beep(700, 0.16, "square", 0.05); }, 130);
  updateHud();
}
function finishWave() {
  var n = state.wave;
  var bonus = Math.round((20 + n*6) * DIFF[state.diff].reward);
  gainGold(bonus);
  state.score += 100 + n*20;
  if (n % 5 === 0) { state.lives += 1; log("🛠️ <b>Dom naprawiony</b> +1 życie", "good"); }
  popText(LAWN_R - 60, cellY(0) + 10, "+" + bonus + " 💰", "#ffd166");
  log("Ukończono <b>falę " + n + "</b>: +" + bonus + " zł", "good");
  state.phase = "idle";
  state.nextIn = 15;
  state.plan = buildWave(n + 1);
  saveBest();
  beep(660, 0.14, "triangle", 0.05); setTimeout(function(){ beep(880, 0.2, "triangle", 0.05); }, 150);
  renderBottom(); updateHud();
}
function gameOver() {
  state.phase = "over";
  saveBest();
  saveScore();
  beep(220, 0.5, "sawtooth", 0.06); setTimeout(function(){ beep(150, 0.8, "sawtooth", 0.06); }, 260);
  showOverlay("over");
}

/* =========================================================================
   8. EMOTE’Y — statystyki, sadzenie, ulepszanie, sprzedaż
   ========================================================================= */
function dmgOf(e)   { return e.def.dmg * Math.pow(1.32, e.level-1) * (1 + Math.min(1.5, e.buffDmg)); }
function rateOf(e)  { return e.def.rate * Math.pow(1.06, e.level-1) * (1 + Math.min(1.5, e.buffRate)); }
function hpMaxOf(e) { return Math.round(e.def.hp * Math.pow(1.25, e.level-1)); }
function produceOf(e){ return e.def.produce * Math.pow(0.92, e.level-1); }
function valueOf(e) { return Math.round(e.def.value * (1 + 0.55*(e.level-1))); }
function slowOf(e)  { return Math.min(0.78, e.def.slow + 0.04*(e.level-1)); }
function upCost(e)  { return Math.round(e.def.cost * 0.8 * Math.pow(1.5, e.level-1)); }
function sellValue(e){ return Math.floor(e.invested * 0.5); }
function gridAt(c, r) { if (!inLawn(c,r)) return null; return state.grid[gkey(c,r)] || null; }

function plantEmote(key, c, r) {
  var def = EMOTES[key];
  if (!inLawn(c,r)) return false;
  if (gridAt(c,r)) { toasty("To pole jest zajęte", "warn"); return false; }
  if ((state.cards[key] || 0) > 0) { toasty("Emote się ładuje ⏳", "warn"); return false; }
  if (!canAfford(def.cost)) { toasty("Za mało złota 💰", "warn"); beep(140, 0.16, "square", 0.05); return false; }
  var e = {
    type:key, def:def, c:c, r:r, x:cellX(c), y:cellY(r), level:1,
    hp:hpMaxOf({ def:def, level:1 }), maxHp:hpMaxOf({ def:def, level:1 }),
    invested:def.cost, shotCd:0.3, produceCd:def.produce*0.55, flash:0,
    buffDmg:0, buffRate:0, kills:0, fuse:(def.kind === "bomb" ? 4 : 0), born:0
  };
  spendGold(def.cost);
  state.grid[gkey(c,r)] = e;
  state.emotes.push(e);
  state.cards[key] = state.sandbox ? 0 : def.recharge;   /* sandbox: bez ładowania kart */
  burst(e.x, e.y + 10, "#3ddc84", 20);
  popText(e.x, e.y - 42, "-" + def.cost, "#ff9aa2");
  beep(430, 0.09, "triangle", 0.05);
  log(charInline(key, 16, "sm") + " <b>" + def.name + "</b> posadzony (" + def.cost + " zł)", null);
  updateHud(); refreshCards();
  return true;
}
function removeEmote(e, reason) {
  if (!e || e.dead) return;
  e.dead = true;
  if (state.grid[gkey(e.c,e.r)] === e) delete state.grid[gkey(e.c,e.r)];
  state.emotes = state.emotes.filter(function(x){ return x !== e; });
  if (state.selected === e) { state.selected = null; renderSel(); }
  if (reason === "eaten") {
    burst(e.x, e.y, "#c86a6a", 24); popText(e.x, e.y - 20, "😢", "#ff9aa2");
    toasty(charInline(e.type, 17, "sm") + " " + e.def.name + " zjedzony!", "warn");
    beep(200, 0.2, "sawtooth", 0.05);
  }
}
function upgradeEmote(e) {
  if (!e) return;
  if (e.level >= 6) { toasty("Maksymalny poziom", "warn"); return; }
  var cost = upCost(e);
  if (!canAfford(cost)) { toasty("Za mało złota 💰", "warn"); beep(140, 0.16, "square", 0.05); return; }
  spendGold(cost); e.invested += cost; e.level++;
  var nm = hpMaxOf(e);
  e.hp += (nm - e.maxHp); e.maxHp = nm;
  burst(e.x, e.y, "#ffd166", 26); popText(e.x, e.y - 24, "lvl " + e.level, "#ffd166");
  beep(660, 0.12, "triangle", 0.05);
  updateHud(); renderSel(); refreshCards();
}
function sellEmote(e) {
  if (!e) return;
  var back = sellValue(e);
  gainGold(back);
  removeEmote(e, "sold");
  popText(e.x, e.y - 20, "+" + back, "#ffd166");
  burst(e.x, e.y, "#ffd166", 18);
  beep(600, 0.1, "sine", 0.05);
  log("Sprzedano <b>" + e.def.name + "</b> (+" + back + " zł)", null);
  updateHud(); renderSel(); refreshCards();
}

/* =========================================================================
   9. ZŁOTO — monety do zbierania (jak słońce w PvZ)
   ========================================================================= */
function dropCoin(x, y, value) {
  state.coins.push({ x:x, y:y, value:value, life:12, max:12, seed:Math.random()*6.28, born:0 });
}
function coinHit(x, y) {
  for (var i = state.coins.length - 1; i >= 0; i--) {
    var c = state.coins[i];
    if (Math.pow(c.x - x, 2) + Math.pow(c.y - y, 2) <= 30*30) return c;
  }
  return null;
}
function collectCoin(c) {
  gainGold(c.value);
  popText(c.x, c.y - 10, "+" + c.value, "#ffd166");
  burst(c.x, c.y, "#ffd166", 12);
  state.coins = state.coins.filter(function(x){ return x !== c; });
  beep(880, 0.08, "sine", 0.04);
  el.goldBox.classList.remove("pop"); void el.goldBox.offsetWidth; el.goldBox.classList.add("pop");
  updateHud();
}
function collectAllCoins() {
  if (!state.coins.length) return;
  var sum = 0;
  state.coins.forEach(function(c){ sum += c.value; popText(c.x, c.y - 10, "+" + c.value, "#ffd166"); });
  gainGold(sum);
  state.coins = [];
  toasty("Zebrano " + sum + " 💰", "gold");
  updateHud();
}
/* =========================================================================
   10. WALKA — obrażenia, spowolnienia, pociski, wybuchy
   ========================================================================= */
function hurt(m, amount, src) {
  if (m.dead) return;
  var armor = m.armor || 0;
  if (src && src.def && src.def.pierce) armor *= (1 - src.def.pierce);
  var d = Math.max(1, amount * (1 - armor));
  m.hp -= d;
  m.hitT = 0.12;
  if (m.hp <= 0) {
    m.dead = true;
    gainGold(m.gold); state.score += m.score; state.kills++; state.waveKilled++;
    if (src) src.kills = (src.kills || 0) + 1;
    popText(m.x, m.y - 34, "+" + m.gold, "#ffd166");
    burst(m.x, m.y, m.boss ? "#ffd166" : "#ff8a3d", m.boss ? 40 : 18);
    beep(m.boss ? 160 : 300, m.boss ? 0.4 : 0.08, "sawtooth", m.boss ? 0.06 : 0.03);
    if (m.boss) { toasty("🏆 " + m.name + " pokonany!", "good"); log("<b>" + m.name + "</b> pokonany! +" + m.gold + " zł", "good"); }
    saveBest();
  }
}
function applySlow(m, f, dur) {
  if (m.dead || m.fly) return;
  if (f >= m.slowF || m.slowT <= 0) m.slowF = f;
  m.slowT = Math.max(m.slowT, dur);
}
function frontMobInRow(row, fromX) {
  var best = null;
  for (var i = 0; i < state.mobs.length; i++) {
    var m = state.mobs[i];
    if (m.dead || m.row !== row) continue;
    if (m.x < fromX - 14) continue;
    if (!best || m.x < best.x) best = m;
  }
  return best;
}
function strongestMob() {
  var best = null;
  for (var i = 0; i < state.mobs.length; i++) {
    var m = state.mobs[i];
    if (m.dead) continue;
    if (!best || m.hp > best.hp) best = m;
  }
  return best;
}
function splashAt(x, y, R, dmg, src, color) {
  for (var i = 0; i < state.mobs.length; i++) {
    var m = state.mobs[i];
    if (m.dead) continue;
    if (Math.hypot(m.x - x, m.y - y) <= R + m.r*0.45) hurt(m, dmg, src);
  }
  ring(x, y, R * 1.25, color || "#a8e05f");
  burst(x, y, color || "#a8e05f", 18);
}
function explode(e) {
  var R = e.def.radius * CW;
  splashAt(e.x, e.y, R, dmgOf(e), e, "#ff9f43");
  ring(e.x, e.y, R * 1.5, "#ffd166");
  burst(e.x, e.y, "#ff9f43", 44);
  shake(13); state.flash = 0.3;
  beep(110, 0.4, "square", 0.08);
  popText(e.x, e.y - 34, "BOOM", "#ff9f43");
  log(charInline("bombowy", 16, "sm") + " <b>Bombowy</b> wybuchnął!", null);
  removeEmote(e, "boom");
}
function fireChain(e, target) {
  var jumps = e.def.chain + Math.floor((e.level-1)/2);
  var cur = target, dmg = dmgOf(e), pts = [{ x:e.x + 10, y:e.y - 6 }], hit = [cur];
  for (var j = 0; j <= jumps && cur; j++) {
    pts.push({ x:cur.x, y:cur.y - 10 });
    hurt(cur, dmg, e);
    dmg *= 0.82;
    var next = null, bd = Infinity;
    for (var i = 0; i < state.mobs.length; i++) {
      var m = state.mobs[i];
      if (m.dead || hit.indexOf(m) >= 0) continue;
      var d = Math.pow(m.x - cur.x, 2) + Math.pow(m.y - cur.y, 2);
      if (d < bd) { bd = d; next = m; }
    }
    cur = (bd <= Math.pow(1.9*CW, 2)) ? next : null;
  }
  state.fx.push({ kind:"bolt", pts:pts, life:0.22, max:0.22, color:"#c9a6ff" });
  beep(1200, 0.06, "square", 0.02);
}

function updateEmotes(dt) {
  var i, j;
  /* aury liczone od nowa */
  for (i = 0; i < state.emotes.length; i++) { state.emotes[i].buffDmg = 0; state.emotes[i].buffRate = 0; }
  for (i = 0; i < state.emotes.length; i++) {
    var A = state.emotes[i];
    if (A.def.kind !== "aura") continue;
    var add = 0.08*(A.level-1);
    for (j = 0; j < state.emotes.length; j++) {
      var o = state.emotes[j];
      if (o === A) continue;
      if (Math.abs(o.c - A.c) <= 1 && Math.abs(o.r - A.r) <= 1) {
        o.buffDmg += A.def.dmgBuff + add;
        o.buffRate += A.def.rateBuff + add*0.6;
      }
    }
  }
  for (i = 0; i < state.emotes.length; i++) {
    var e = state.emotes[i];
    if (e.flash > 0) e.flash = Math.max(0, e.flash - dt*3);
    e.born += dt;
    var k = e.def.kind;
    if (k === "wall" || k === "aura") continue;

    if (k === "money") {
      e.produceCd -= dt;
      if (e.produceCd <= 0) {
        e.produceCd = produceOf(e);
        dropCoin(e.x + (Math.random()*34 - 17), e.y - 4, valueOf(e));
        e.flash = 1;
        beep(760, 0.07, "sine", 0.03);
      }
      continue;
    }
    if (k === "bomb") {
      e.fuse -= dt;
      var nearBomb = null;
      for (j = 0; j < state.mobs.length; j++) {
        var mb = state.mobs[j];
        if (mb.dead) continue;
        if (Math.hypot(mb.x - e.x, mb.y - e.y) <= 2.0*CW) { nearBomb = mb; break; }
      }
      if (e.fuse <= 0 || nearBomb) explode(e);
      continue;
    }

    e.shotCd -= dt;
    if (e.shotCd > 0) continue;

    if (k === "sniper") {
      var st = strongestMob();
      if (!st) continue;
      e.shotCd = 1 / rateOf(e);
      e.flash = 1;
      state.fx.push({ kind:"beam", x1:e.x + 8, y1:e.y - 8, x2:st.x, y2:st.y - 10, life:0.18, max:0.18, color:"#ff6b6b" });
      hurt(st, dmgOf(e), e);
      beep(900, 0.06, "square", 0.025);
      continue;
    }
    if (k === "stun") {
      var hitAny = false;
      for (j = 0; j < state.mobs.length; j++) {
        var ms = state.mobs[j];
        if (ms.dead || ms.row !== e.r) continue;
        if (ms.x >= e.x - 10 && ms.x <= e.x + e.def.reach*CW) {
          ms.stunT = Math.max(ms.stunT, e.def.stunDur + 0.08*(e.level-1));
          hurt(ms, dmgOf(e), e);
          popText(ms.x, ms.y - 30, "★", "#ff7ad9");
          hitAny = true;
        }
      }
      if (hitAny) {
        e.shotCd = 1 / rateOf(e);
        e.flash = 1;
        state.fx.push({ kind:"ring", x:e.x, y:e.y, r:1.3*CW, life:0.3, max:0.3, color:"#ff7ad9" });
        beep(520, 0.14, "sawtooth", 0.03);
      }
      continue;
    }
    if (k === "chain") {
      var ct = frontMobInRow(e.r, e.x);
      if (!ct) continue;
      e.shotCd = 1 / rateOf(e);
      e.flash = 1;
      fireChain(e, ct);
      continue;
    }

    /* strzelcy strzelający pociskami (shoot / slow / splash) */
    var t = frontMobInRow(e.r, e.x);
    if (!t) continue;
    e.shotCd = 1 / rateOf(e);
    e.flash = 1;
    if (k === "splash") {
      var d0 = Math.hypot(t.x - e.x, t.y - e.y);
      state.shots.push({ kind:"lob", x:e.x + 6, y:e.y - 6, tx:t.x, ty:t.y, row:e.r,
                         spd:300, dmg:dmgOf(e), splash:e.def.splash*CW, src:e, total:d0, color:"#a8e05f" });
      beep(620, 0.05, "square", 0.02);
    } else {
      state.shots.push({ kind:"pea", x:e.x + 16, y:e.y - 8, row:e.r, spd:420,
                         dmg:dmgOf(e), src:e, color:(k === "slow" ? "#9fe6ff" : "#8ff06a"),
                         slowF:(k === "slow" ? slowOf(e) : 0), slowDur:(k === "slow" ? e.def.slowDur : 0) });
    }
  }
}
function updateShots(dt) {
  for (var i = state.shots.length - 1; i >= 0; i--) {
    var s = state.shots[i];
    if (s.kind === "lob") {
      var dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy), st = s.spd * dt;
      if (d <= st + 3) { splashAt(s.tx, s.ty, s.splash, s.dmg, s.src, s.color); state.shots.splice(i,1); continue; }
      s.x += dx/d*st; s.y += dy/d*st;
      s.arc = Math.sin(Math.max(0, Math.min(1, d / (s.total || 1))) * Math.PI) * 30;
      continue;
    }
    s.x += s.spd * dt;
    var hit = null;
    for (var j = 0; j < state.mobs.length; j++) {
      var m = state.mobs[j];
      if (m.dead || m.row !== s.row) continue;
      if (s.x + 7 > m.x - m.r && s.x - 7 < m.x + m.r) { hit = m; break; }
    }
    if (hit) {
      hurt(hit, s.dmg, s.src);
      if (s.slowF) applySlow(hit, s.slowF, s.slowDur);
      burst(s.x, s.y, s.color, 9);
      state.shots.splice(i,1);
      continue;
    }
    if (s.x > W + 12) state.shots.splice(i,1);
  }
}

/* =========================================================================
   11. MOBY — chodzenie, zjadanie emote’ów, kosiarki
   ========================================================================= */
function reachedHouse(m) {
  var mw = state.mowers[m.row];
  if (mw && !mw.used && !mw.active) {
    mw.active = true; mw.x = 46;
    toasty("🚜 Kosiarka rusza w pasie " + (m.row+1) + "!", "gold");
    log("🚜 <b>Kosiarka</b> ratuje pas " + (m.row+1), "gold");
    beep(300, 0.3, "square", 0.06);
    return;
  }
  m.dead = true; state.leaks++;
  state.flash = 0.5; shake(11);
  ring(X0, m.y, 48, "#ff5d5d");
  beep(120, 0.3, "sawtooth", 0.07);

  el.gold.textContent = state.sandbox ? "∞" : state.gold;
  el.lives.textContent = state.sandbox ? "∞" : state.lives;
  el.wave.textContent = state.wave;
  el.score.textContent = state.score;
  el.best.textContent = state.sandbox ? "—" : Math.max(state.best, state.wave);
  el.livesBox.className = "stat lives" + (state.lives <= 4 && !state.sandbox ? " low" : "");
  el.sand.className = "stat sand" + (state.sandbox ? "" : " hidden");
  var alive = 0;
  for (var i = 0; i < state.mobs.length; i++) if (!state.mobs[i].dead) alive++;
  el.mobs.textContent = alive;

  el.rage.className = "btn" + (state.rageCd > 0 ? "" : " on");
  el.rageLb.textContent = state.rageCd > 0 ? (Math.ceil(state.rageCd) + " s") : "Wściekłość";
  el.menu.className = "btn" + (state.paused && state.phase !== "menu" ? " on" : "");
  el.menuLb.textContent = state.paused && state.phase !== "menu" ? "Wznów" : "Menu";
  el.speedLb.textContent = state.speed + "×";
  setUse(el.sound, state.sound ? "volOn" : "volOff");
  el.waveBtn.disabled = (state.phase === "running");

  el.waveLabel.textContent = "Fala " + (state.phase === "running" ? state.wave : state.wave + 1);
  el.waveSub.textContent = state.phase === "running" ? "w toku"
    : (state.phase === "idle" ? "przygotowanie" : (state.phase === "over" ? "dom stracony" : "menu"));
  var nextBoss = (Math.floor(state.wave / 5) + 1) * 5;
  var until = nextBoss - state.wave;
  el.bossInfo.textContent = (state.phase === "running" && state.wave % 5 === 0) ? "BOSS!"
    : ("boss za " + until + (until === 1 ? " falę" : (until < 5 ? " fale" : " fal")));

  var total = state.plan.length || 1;
  var prog = state.phase === "running" ? Math.min(1, (state.spawnI + state.waveKilled) / (2*total))
           : (state.wave > 0 ? 1 : 0);
  el.progFill.style.width = (prog*100).toFixed(1) + "%";
  el.progTxt.textContent = Math.round(prog*100) + "%";
  if (state.phase === "idle" && state.auto) el.autoIn.textContent = Math.ceil(Math.max(0, state.nextIn));
}
function buildCards() {
  el.cardNodes = {};
  el.cards.innerHTML = "";
  CARDS.forEach(function(key, idx) {
    var d = EMOTES[key];
    var b = document.createElement("button");
    b.className = "card"; b.type = "button";
    b.title = d.name + " (" + d.cost + " zł) — " + d.desc + "  [klawisz " + (idx < 9 ? idx+1 : 0) + "]";
    b.innerHTML = '<span class="k">' + (idx < 9 ? idx+1 : 0) + '</span>' +
                  '<span class="e">' + charInline(key, 30, "sm") + '</span>' +
                  '<span class="n">' + d.name + '</span>' +
                  '<span class="c">' + d.cost + ic("coin", 11) + '</span>' +
                  '<span class="cd"></span>';
    b.addEventListener("click", function(){ armCard(key); });
    el.cards.appendChild(b);
    el.cardNodes[key] = { btn:b, cd:b.querySelector(".cd") };
  });
}
function refreshCards() {
  for (var i = 0; i < CARDS.length; i++) {
    var key = CARDS[i], def = EMOTES[key], node = el.cardNodes[key];
    if (!node) continue;
    var cd = state.cards[key] || 0;
    node.cd.style.height = (cd > 0 ? (cd / def.recharge * 100) : 0).toFixed(1) + "%";
    var dis = !canAfford(def.cost) || cd > 0;
    node.btn.className = "card" + (state.armed === key ? " armed" : "") + (dis ? " dis" : "");
  }
}
function armCard(key) {
  if (state.phase === "menu" || state.phase === "over") return;
  if (AC && AC.state === "suspended") AC.resume();
  if (state.armed === key) { state.armed = null; }
  else if ((state.cards[key] || 0) > 0) { toasty("Emote się ładuje " + ic("hourglass", 14), "warn"); return; }
  else if (!canAfford(EMOTES[key].cost)) { toasty("Za mało złota " + ic("coin", 14) + " (" + EMOTES[key].cost + ")", "warn"); return; }
  else { state.armed = key; state.selected = null; renderSel(); }
  refreshCards(); updateHud();
}
function renderSel() {

function togglePause() {

  else openPause();

/* =========================================================================
   16. STEROWANIE
   ========================================================================= */
function toLocal(ev) {
  var r = cv.getBoundingClientRect();
  return { x:(ev.clientX - r.left) * (W / r.width), y:(ev.clientY - r.top) * (H / r.height) };
}
function onMove(ev) {
  if (state.phase === "menu") return;
  var p = toLocal(ev);
  var c = colAt(p.x), r = rowAt(p.y);
  state.hover = inLawn(c, r) ? { c:c, r:r } : null;
  var overCoin = coinHit(p.x, p.y);
  cv.style.cursor = overCoin ? "grab" : (state.armed ? "crosshair" : (state.hover && gridAt(c, r) ? "pointer" : "default"));
}
function onDown(ev) {
  if (state.phase === "menu" || state.phase === "over") return;
  if (AC && AC.state === "suspended") AC.resume();
  var p = toLocal(ev);
  var coin = coinHit(p.x, p.y);
  if (coin) { collectCoin(coin); return; }
  var c = colAt(p.x), r = rowAt(p.y);
  if (!inLawn(c, r)) { state.armed = null; state.selected = null; renderSel(); refreshCards(); return; }
  var existing = gridAt(c, r);
  if (state.armed && !existing) { plantEmote(state.armed, c, r); return; }
  if (existing) { state.selected = existing; state.armed = null; renderSel(); refreshCards(); return; }
  state.selected = null; renderSel();
}
function onContext(ev) {
  ev.preventDefault();
  state.armed = null; state.selected = null;
  renderSel(); refreshCards(); updateHud();
}
function cycleSpeed() {
  state.speed = state.speed === 1 ? 2 : (state.speed === 2 ? 3 : 1);
  updateHud(); toasty("Tempo " + state.speed + "×", null);
}
function startGame(diffKey) {
  state.diff = diffKey || state.diff;
  var D = DIFF[state.diff];
  state.sandbox = (state.mode === "sandbox");
  state.phase = "idle"; state.wave = 0;
  state.gold = state.sandbox ? 99999 : D.gold;
  state.lives = state.sandbox ? 99 : D.lives;
  state.score = 0; state.kills = 0; state.leaks = 0;
  state.newRecord = false; state.runSaved = false;
  state.mobs = []; state.emotes = []; state.shots = []; state.fx = []; state.coins = []; state.grid = {};
  state.cards = {}; CARDS.forEach(function(k){ state.cards[k] = 0; });
  state.mowers = [];
  for (var r = 0; r < ROWS; r++) state.mowers.push({ row:r, x:58, active:false, used:false });
  state.selected = null; state.armed = null; state.rageCd = 0; state.coinTimer = 5;
  state.speed = 1; state.paused = false; state.nextIn = 15; state.flash = 0; state.shake = 0;
  state.plan = buildWave(1); state.spawnI = 0; state.waveTime = 0; state.waveKilled = 0; state.totalSpawned = 0;
  savePrefs();
  el.log.innerHTML = "";
  log("Nowa gra — poziom <b>" + D.name + "</b>" +
      (state.sandbox ? " · <b>tryb SANDBOX</b> (∞ złoto, ∞ życia)" : "") +
      ". Sadz emote’y i startuj falę!", "gold");
  renderSel(); refreshCards(); updateHud();
  showOverlay("none");
  toasty(state.sandbox ? "🧪 Sandbox: nieskończone złoto i życia!" : "Powodzenia! Klikaj monety 💰 i sadz emote’y",
         state.sandbox ? null : "good");
}

  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.aspectRatio = W + " / " + H;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  el = {
    gold:document.getElementById("s-gold"), goldBox:document.getElementById("w-gold"),
    lives:document.getElementById("s-lives"), livesBox:document.getElementById("w-lives"),
    sand:document.getElementById("w-sand"),
    wave:document.getElementById("s-wave"), mobs:document.getElementById("s-mobs"),
    score:document.getElementById("s-score"), best:document.getElementById("s-best"),
    speed:document.getElementById("btn-speed"), menu:document.getElementById("btn-menu"),
    rage:document.getElementById("btn-rage"), sound:document.getElementById("btn-sound"),
    speedLb:document.getElementById("lb-speed"), menuLb:document.getElementById("lb-menu"),
    rageLb:document.getElementById("lb-rage"),
    help:document.getElementById("btn-help"), restart:document.getElementById("btn-restart"),
    cards:document.getElementById("cards"), sel:document.getElementById("selpanel"),
    waveLabel:document.getElementById("wave-label"), waveSub:document.getElementById("wave-sub"),
    bossInfo:document.getElementById("boss-info"), progFill:document.getElementById("prog-fill"),
    progTxt:document.getElementById("prog-txt"), waveBtn:document.getElementById("btn-wave"),
    auto:document.getElementById("chk-auto"), autoIn:document.getElementById("auto-in"),
    log:document.getElementById("log"), toasts:document.getElementById("toasts"),
    overlay:document.getElementById("overlay")
  };

  loadBest();
  buildIcons();
  paintStaticIcons();
  var brandMark = document.getElementById("brand-mark");
  if (brandMark) brandMark.innerHTML = charInline("wsciekly", 26, "sm");
  state.sandbox = (state.mode === "sandbox");
  buildCards();
  renderSel();
  for (var r = 0; r < ROWS; r++) state.mowers.push({ row:r, x:58, active:false, used:false });

  cv.addEventListener("pointermove", onMove);
  cv.addEventListener("pointerdown", onDown);
  cv.addEventListener("contextmenu", onContext);
  window.addEventListener("resize", function() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  });

  el.speed.addEventListener("click", cycleSpeed);
  el.menu.addEventListener("click", openPause);
  el.rage.addEventListener("click", rage);
  el.sound.addEventListener("click", function(){ state.sound = !state.sound; updateHud(); });
  el.help.addEventListener("click", function(){
    if (state.phase === "menu" || state.phase === "over") showOverlay("help", state.overlayKind);
    else { state.paused = true; updateHud(); showOverlay("help", "pause"); }
  });
  el.restart.addEventListener("click", function(){ startGame(state.diff); });
  el.waveBtn.addEventListener("click", startWave);
  el.auto.addEventListener("change", function(){ state.auto = el.auto.checked; });
  el.overlay.addEventListener("click", function(ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.diff) { state.diff = b.dataset.diff; savePrefs(); showOverlay("menu"); return; }
    if (b.dataset.mode) {
      state.mode = b.dataset.mode; state.sandbox = (state.mode === "sandbox");
      savePrefs(); showOverlay("menu"); return;
    }
    var a = b.dataset.act;
    if (a === "start") startGame(state.diff);
    else if (a === "resume") { state.paused = false; showOverlay("none"); updateHud(); }
    else if (a === "restart-game") startGame(state.diff);
    else if (a === "sound") { state.sound = !state.sound; updateHud(); showOverlay(state.overlayKind, state.overlayBack); }
    else if (a === "help") { showOverlay("help", state.overlayKind); }
    else if (a === "menu") { saveScore(); state.phase = "menu"; state.paused = false; showOverlay("menu"); }
    else if (a === "close") {
      var back = state.overlayBack;
      if (back === "pause" && state.phase !== "menu" && state.phase !== "over") { state.paused = true; showOverlay("pause"); }
      else showOverlay("menu");
    }
  });

  document.addEventListener("keydown", function(ev) {
    if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
    var k = ev.key;
    var overlayOpen = !el.overlay.classList.contains("hidden");
    if (state.phase === "menu" || state.phase === "over") {
      if (k === "Enter" || k === " ") { ev.preventDefault(); startGame(state.diff); }
      else if (k === "Escape" && overlayOpen && state.overlayKind === "help") showOverlay(state.phase === "over" ? "over" : "menu");
      return;
    }
    if (k === "Escape") {
      if (overlayOpen) {
        if (state.overlayKind === "help") { state.paused = true; showOverlay("pause"); }
        else { state.paused = false; showOverlay("none"); }
      } else { state.armed = null; state.selected = null; }
      renderSel(); refreshCards(); updateHud(); return;
    }
    if (overlayOpen) {   /* w pauzie/pomocy skróty nie działają na planszę */
      if (k === "p" || k === "P" || k === " ") { ev.preventDefault(); state.paused = false; showOverlay("none"); updateHud(); }
      return;
    }
    if (k >= "1" && k <= "9") { armCard(CARDS[parseInt(k,10) - 1]); return; }
    if (k === "0") { armCard(CARDS[9]); return; }
    if (k === " ") { ev.preventDefault(); if (state.phase === "idle") startWave(); else togglePause(); return; }
    if (k === "p" || k === "P") { togglePause(); return; }
    if (k === "f" || k === "F") { cycleSpeed(); return; }
    if (k === "u" || k === "U") { upgradeEmote(state.selected); return; }
    if (k === "s" || k === "S") { sellEmote(state.selected); return; }
    if (k === "c" || k === "C") { collectAllCoins(); return; }
    if (k === "r" || k === "R") { rage(); return; }
    if (k === "m" || k === "M") { state.sound = !state.sound; updateHud(); return; }
    if (k === "h" || k === "H") { state.paused = true; updateHud(); showOverlay("help", "pause"); return; }
  });

  renderSel(); refreshCards(); updateHud();
  showOverlay("menu");
  requestAnimationFrame(frame);
}
/* =========================================================================
   18. PĘTLA GRY
   ========================================================================= */
var last = 0, hudT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  var dt = (ts - last) / 1000; last = ts;
  if (dt > 0.25) dt = 0.25;

  updateFx(dt);
  var sim = state.paused ? 0 : dt * state.speed;
  if (sim > 0 && (state.phase === "running" || state.phase === "idle")) {
    var left = sim, g = 0;
    while (left > 1e-6 && g++ < 40) { var h = Math.min(left, 1/60); step(h); left -= h; }
  }
  if (sim > 0 && state.phase === "idle" && state.auto) {
    state.nextIn -= sim;
    if (state.nextIn <= 0) startWave();
  }
  hudT += dt;
  if (hudT > 0.2) { hudT = 0; updateHud(); refreshCards(); }
  draw();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
})();
</script>
