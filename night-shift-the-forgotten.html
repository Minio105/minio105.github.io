function fit(){
  const s = Math.min(window.innerWidth / W, (window.innerHeight - 20) / H);
  cvs.style.width  = Math.floor(W * s) + 'px';
  cvs.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ------------------------------ utils ---------------------------------- */
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a)*t;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ------------------------------ dźwięk --------------------------------- */
const SND = {
  ctx:null, master:null, noiseBuf:null, fanGain:null, humGain:null, lineGain:null,
  ok:false, muted:false,
  init(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ctx.destination);

      const len = Math.floor(this.ctx.sampleRate * 2);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;

      // szum wentylatora (biuro)
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 360;
      const g = this.ctx.createGain(); g.gain.value = 0.05;
      src.connect(lp); lp.connect(g); g.connect(this.master); src.start();
      this.fanGain = g;

      // basowy pomruk
      const o1 = this.ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 47;
      const o2 = this.ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 52.3;
      const dg = this.ctx.createGain(); dg.gain.value = 0.045;
      o1.connect(dg); o2.connect(dg); dg.connect(this.master); o1.start(); o2.start();

      // buczenie lamp (wyciszone)
      const hum = this.ctx.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 118;
      const hg = this.ctx.createGain(); hg.gain.value = 0.0;
      hum.connect(hg); hg.connect(this.master); hum.start();
      this.humGain = hg;

      // szum linii telefonicznej
      const line = this.ctx.createBufferSource(); line.buffer = buf; line.loop = true;
      const lf = this.ctx.createBiquadFilter(); lf.type = 'bandpass'; lf.frequency.value = 1700; lf.Q.value = 0.7;
      const lg = this.ctx.createGain(); lg.gain.value = 0.0;
      line.connect(lf); lf.connect(lg); lg.connect(this.master); line.start();
      this.lineGain = lg;

      this.ok = true;
    } catch(e){ this.ok = false; }
  },
  noise(dur, vol, freq, type){
    if (!this.ok) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq || 800;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.05);
  },
  tone(f1, f2, dur, vol, type, delay){
    if (!this.ok) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator(); o.type = type || 'sine';
    const g = this.ctx.createGain();
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  setHum(v){ if (this.humGain) this.humGain.gain.value = v; },
  setFan(v){ if (this.fanGain) this.fanGain.gain.value = v; },
  setLine(v){ if (this.lineGain) this.lineGain.gain.value = v; },
  setMute(v){
    this.muted = !!v;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },
  ring(){
    for (let i = 0; i < 2; i++){
      this.tone(720, 720, 0.26, 0.10, 'triangle', i * 0.34);
      this.tone(980, 980, 0.26, 0.05, 'triangle', i * 0.34);
    }
  },
  pickup(){ this.tone(320, 540, 0.12, 0.11, 'square'); this.noise(0.22, 0.09, 2400, 'bandpass'); },
  hangup(){ this.tone(430, 190, 0.18, 0.11, 'square'); this.noise(0.3, 0.07, 1200); },
  syllable(base){
    const f = (base || 118) * (0.82 + Math.random() * 0.45);
    this.tone(f, f * 1.18, 0.06 + Math.random() * 0.06, 0.05, 'sawtooth');
    this.noise(0.05, 0.025, 900 + Math.random() * 800, 'bandpass');
  },
  blip(){ this.tone(880, 620, 0.06, 0.09, 'square'); },
  step(){ this.noise(0.14, 0.16, 620, 'lowpass'); },
  knock(){ this.noise(0.22, 0.30, 240, 'lowpass'); this.tone(90, 50, 0.3, 0.16, 'sine'); },
  shut(){ this.noise(0.3, 0.34, 300, 'lowpass'); this.tone(120, 45, 0.4, 0.2, 'square'); },
  open(){ this.noise(0.25, 0.22, 420, 'lowpass'); this.tone(70, 140, 0.35, 0.12, 'sawtooth'); },
  shriek(){ this.tone(1400, 300, 0.5, 0.12, 'sawtooth'); this.noise(0.5, 0.14, 2600, 'bandpass'); },
  scream(){
    this.noise(1.0, 0.5, 1500, 'bandpass');
    this.tone(760, 55, 1.1, 0.34, 'sawtooth');
    this.tone(190, 40, 1.3, 0.3, 'square');
  },
  bang(){ this.noise(0.35, 0.36, 180, 'lowpass'); this.tone(70, 40, 0.5, 0.22, 'square'); },
  run(){
    for (let i = 0; i < 8; i++) this.tone(96 - i * 5, 66, 0.05, 0.13, 'square', i * 0.08);
    this.noise(0.65, 0.09, 500, 'lowpass');
  },
  toy(){ this.tone(880, 1240, 0.16, 0.07, 'triangle'); this.tone(1320, 900, 0.14, 0.05, 'triangle', 0.12); },
  gen(){ if (Math.random() < 0.15) this.tone(300 + Math.random()*160, 260, 0.08, 0.05, 'triangle'); },
  warn(){ this.tone(300, 180, 0.5, 0.16, 'sawtooth'); },
  dead(){ this.tone(220, 30, 1.4, 0.3, 'sawtooth'); this.noise(1.4, 0.3, 500); },
  chime(){
    const n = [523, 659, 784, 1046];
    for (let i = 0; i < n.length; i++) this.tone(n[i], n[i], 0.5, 0.12, 'triangle', i * 0.18);
  }
};

/* ------------------------------ input ---------------------------------- */
const mouse = { x:0, y:0, down:false };
const keys = {};
let frameButtons = [];
let pendingClick = null;
let windRect = null;

function toLogical(e){
  const r = cvs.getBoundingClientRect();
  return { x:(e.clientX - r.left) * (W / r.width), y:(e.clientY - r.top) * (H / r.height) };
}
cvs.addEventListener('mousemove', e => { const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; });
cvs.addEventListener('mousedown', e => {
  e.preventDefault(); SND.init();
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true; pendingClick = p;
});
window.addEventListener('mouseup', () => { mouse.down = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('touchstart', e => {
  e.preventDefault(); SND.init();
  const t = e.changedTouches[0], r = cvs.getBoundingClientRect();
  const p = { x:(t.clientX - r.left) * (W / r.width), y:(t.clientY - r.top) * (H / r.height) };
  mouse.x = p.x; mouse.y = p.y; mouse.down = true; pendingClick = p;
}, { passive:false });
cvs.addEventListener('touchend', e => { e.preventDefault(); mouse.down = false; }, { passive:false });

window.addEventListener('keydown', e => {
  SND.init();
  const k = e.key ? e.key.toLowerCase() : '';
  keys[k] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
      e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
  if (e.repeat) return;
  handleKey(e, k);
});
window.addEventListener('keyup', e => { keys[e.key ? e.key.toLowerCase() : ''] = false; });

function handleKey(e, k){
  if (k === 'v'){ toggleFull(); return; }
  const st = G.state;
  if (st === 'menu'){
    if (e.code === 'Enter' || e.code === 'Space'){ if (save.night > 1) startNight(save.night); else startNight(1); }
    if (k === 'n') startNight(1);
    if (k === 'i') G.state = 'how';
    if (k === 'w') G.state = 'lore';
    return;
  }
  if (st === 'intro'){ if (e.code === 'Space' || e.code === 'Enter') beginPlay(); return; }
  if (st === 'lore' || st === 'how'){ if (e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter') G.state = 'menu'; return; }
  if (st === 'jumpscare') return;
  if (st === 'gameover'){
    if (k === 'r' || e.code === 'Enter') startNight(G.night);
    if (e.code === 'Escape') G.state = 'menu';
    return;
  }
  if (st === 'win'){
    if (e.code === 'Enter' || e.code === 'Space') nextNight();
    if (e.code === 'Escape') G.state = 'menu';
    return;
  }
  if (st === 'pause'){
    if (k === 'p' || e.code === 'Escape') G.state = 'play';
    if (k === 'm') G.state = 'menu';
    return;
  }
  if (st === 'play'){
    if (k === 'p' || e.code === 'Escape'){ G.state = 'pause'; return; }
    if (e.code === 'Space'){ toggleCams(); return; }
    if (k === 't'){ phoneAction(); return; }
    if (k === 'a') toggleDoor('L');
    else if (k === 'd') toggleDoor('R');
    else if (k === 's') toggleDoor('V');
    else if (k === 'q') toggleLight('L');
    else if (k === 'e') toggleLight('R');
    else if (k === 'f') toggleLight('V');
    else if (CAM_KEYS[k]) setCam(CAM_KEYS[k]);
  }
}
const CAM_KEYS = { '1':'C1','2':'C2','3':'C3','4':'C4','5':'C5','6':'C6',
                   '7':'C7','8':'C8','9':'C9','0':'C10','-':'C11','=':'C12' };

/* ------------------------------ UI ------------------------------------- */
function txt(s, x, y, size, color, align, weight, base){
  ctx.font = (weight || 'normal') + ' ' + size + 'px "Segoe UI",Roboto,Arial,sans-serif';
  ctx.fillStyle = color || '#c9c9c9';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = base || 'alphabetic';
  ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function btn(id, x, y, w, h, label, active, sub){
  const hover = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (active){
    g.addColorStop(0, hover ? '#96322f' : '#712424');
    g.addColorStop(1, hover ? '#5c1c1c' : '#421414');
  } else {
    g.addColorStop(0, hover ? '#313c4a' : '#222a34');
    g.addColorStop(1, hover ? '#232c37' : '#141a22');
  }
  ctx.fillStyle = g;
  rr(x, y, w, h, 8); ctx.fill();
  ctx.strokeStyle = active ? (hover ? '#e57a7a' : '#ad4a4a') : (hover ? '#5d6b7d' : '#3a4350');
  ctx.lineWidth = 2;
  rr(x + 1, y + 1, w - 2, h - 2, 7); ctx.stroke();
  if (active || hover){
    ctx.save();
    ctx.globalAlpha = active ? 0.10 : 0.06;
    ctx.fillStyle = active ? '#ff9c9c' : '#9cc2ff';
    rr(x, y, w, h, 8); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = active ? '#ffe2e2' : (hover ? '#eaf0f7' : '#b6bfcc');
  ctx.font = 'bold 19px "Segoe UI",Roboto,Arial,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 - (sub ? 8 : 0));
  if (sub){
    ctx.font = '13px "Segoe UI",Roboto,Arial,sans-serif';
    ctx.fillStyle = active ? 'rgba(255,200,200,0.75)' : 'rgba(160,172,190,0.7)';
    ctx.fillText(sub, x + w / 2, y + h / 2 + 12);
  }
  frameButtons.push({ id, x, y, w, h });
}
function hotspot(id, x, y, w, h){ frameButtons.push({ id, x, y, w, h }); }
function btnS(id, x, y, w, h, label, active){
  const hover = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (active){
    g.addColorStop(0, hover ? '#9a3532' : '#752626');
    g.addColorStop(1, hover ? '#5d1d1d' : '#431515');
  } else {
    g.addColorStop(0, hover ? '#313c4a' : '#1e2630');
    g.addColorStop(1, hover ? '#242d38' : '#131920');
  }
  ctx.fillStyle = g; rr(x, y, w, h, 6); ctx.fill();
  ctx.strokeStyle = active ? '#b05050' : (hover ? '#5d6b7d' : '#333c48');
  ctx.lineWidth = 1.5; rr(x + 0.75, y + 0.75, w - 1.5, h - 1.5, 5.5); ctx.stroke();
  txt(label, x + w / 2, y + h / 2 + 1, 13, active ? '#ffe2e2' : (hover ? '#eaf0f7' : '#a8b3c0'), 'center', 'bold', 'middle');
  frameButtons.push({ id, x, y, w, h });
}
function hitButton(p){
  for (let i = frameButtons.length - 1; i >= 0; i--){
    const b = frameButtons[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
  }
  return null;
}
function msg(s){
  G.msg = s; G.msgT = 3.4;
}

/* ------------------------------ akcje ---------------------------------- */
function toggleDoor(side){
  if (G.state !== 'play' || G.blackout) return;
  G.doors[side] = !G.doors[side];
  if (G.doors[side]) SND.shut(); else SND.open();
}
function toggleLight(side){
  if (G.state !== 'play' || G.blackout) return;
  G.lights[side] = !G.lights[side];
  SND.blip();
}
function toggleCams(){
  if (G.state !== 'play' || G.blackout) return;
  G.camUp = !G.camUp;
  SND.blip();
  gates(CAM_ROOM[G.cam]);
  if (!G.camUp) gates(null);
}
function setCam(c){
  if (G.state !== 'play' || G.blackout) return;
  if (G.camUp && G.cam !== c){
    G.cam = c; SND.blip(); gates(CAM_ROOM[c]);
  } else if (!G.camUp){
    G.camUp = true; G.cam = c; SND.blip(); gates(CAM_ROOM[c]);
  }
}

/* ---------------------- pełny ekran i telefon --------------------------- */
function toggleFull(){
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement){
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch(e){}
}
document.addEventListener('fullscreenchange', () => { setTimeout(fit, 60); });
document.addEventListener('webkitfullscreenchange', () => { setTimeout(fit, 60); });

function phoneAction(){
  if (G.state !== 'play') return;
  const p = G.phone;
  if (p.state === 'ring'){
    p.state = 'talk'; p.line = 0; p.char = 0; p.syl = 0; p.next = 0.35;
    SND.pickup();
  } else if (p.state === 'talk'){
    const text = PHONE[G.night][p.line];
    if (p.char < text.length) { p.char = text.length; p.syl = Math.ceil(text.length / 6); }
    else phoneNext();
  }
}
function phoneNext(){
  const p = G.phone, lines = PHONE[G.night];
  p.line++; p.char = 0; p.syl = 0; p.next = 0.25;
  if (p.line >= lines.length){
    p.state = 'done';
    SND.hangup(); SND.setLine(0);
  } else SND.blip();
}
function updPhone(dt){
  const p = G.phone;
  if (p.state === 'off'){
    if (G.nightTime > p.ringAt){
      p.state = 'ring'; p.ring = 3; p.t = 0;
      SND.ring();
      msg('Telefon dzwoni — [T] lub klik na aparat.');
    }
    return;
  }
  if (p.state === 'ring'){
    p.t += dt;
    if (p.t > 1.9){
      p.t = 0; p.ring--;
      if (p.ring <= 0){ p.state = 'done'; msg('Nieodebrane połączenie.'); }
      else SND.ring();
    }
    return;
  }
  if (p.state === 'talk'){
    SND.setLine(0.013);
    if (p.next > 0){ p.next -= dt; return; }
    const text = PHONE[G.night][p.line];
    p.char += dt * 32;
    const syl = Math.floor(p.char / 6);
    while (p.syl < syl){ p.syl++; SND.syllable(p.pitch); }
    if (p.char >= text.length + 26) phoneNext();
  }
}

// Bramka zdarzeń "mrugnięcia" - Ten, Który Czeka korzysta z każdej zmiany obrazu.
function gates(room){
  const B = G.enemies.find(e => e.id === 'B');
  if (!B || !B.active || B.atDoor) return;
  if (G.state !== 'play') return;
  if (G.time - (B.blinkCd || 0) < 1.2) return;
  B.blinkCd = G.time;
  const chance = room === B.room ? 0 : B.cfg.ch;
  if (Math.random() < chance) advanceEnemy(B);
}

function startNight(n){
  G.night = clamp(n, 1, NIGHTS.length);
  const conf = NIGHTS[G.night - 1];
  G.state = 'intro';
  G.hourLen = conf.hourLen;
  G.nightTime = 0; G.hour = 0;
  G.power = 100; G.blackout = false; G.blackoutT = 0;
  G.doors = { L:false, R:false, V:false };
  G.lights = { L:false, R:false, V:false };
  G.camUp = false; G.cam = 'C1';
  G.windEnabled = !!conf.enemies.D;
  G.wind = 100; G.dState = 'calm'; G.dTimer = 0;
  G.glitch = 0; G.flicker = 0; G.shake = 0; G.flash = 0;
  G.msg = ''; G.msgT = 0; G.ambT = 22 + Math.random() * 15;
  G.phone = { state:'off', t:0, ring:0, line:0, char:0, syl:0,
              ringAt:7 + Math.random() * 8, pitch:112 + Math.random() * 26, next:0 };
  G.enemies = [];
  for (const id of ['A','B','C','E','F','H']){
    const c = conf.enemies[id];
    if (!c) continue;
    G.enemies.push({
      id, name:EVIS[id].name, path:EPATH[id], idx:0,
      timer:(c.iv || 5) * (0.6 + Math.random() * 0.7),
      atDoor:false, doorTimer:0, litT:0, retreats:0, active:true, cfg:c,
      blinkCd:0, downT:0, charge:0, warned:false
    });
  }
  SND.setHum(0);
}
function beginPlay(){
  G.state = 'play';
  G.tip = 0;
  SND.init();
}
function nextNight(){
  if (G.night < NIGHTS.length) startNight(G.night + 1);
  else G.state = 'menu';
}
function retry(){ startNight(G.night); }

function powerOut(){
  G.blackout = true;
  G.blackoutT = 6 + Math.random() * 13;
  G.doors = { L:false, R:false, V:false };
  G.lights = { L:false, R:false, V:false };
  G.camUp = false;
  SND.dead(); SND.setHum(0);
  msg('ENERGIA: 0%. Wszystko gaśnie.');
}
function attack(id){
  if (G.state !== 'play') return;
  G.state = 'jumpscare';
  G.jumpEnemy = id;
  G.jsT = 0;
  SND.scream();
}
function endJumpscare(){
  G.state = 'gameover';
}
function win(){
  G.state = 'win';
  SND.chime();
  const idx = clamp(G.night - 1, 0, NOTES.length - 1);
  save.notes[idx] = true;
  if (save.night <= G.night && G.night < NIGHTS.length) save.night = G.night + 1;
  if (G.night >= NIGHTS.length) save.night = NIGHTS.length;
  persist();
}

/* --------------------- ruch przeciwników -------------------------------- */
function advanceEnemy(e){
  if (e.idx < e.path.length - 1){
    e.idx++;
    if (e.idx === e.path.length - 1){
      e.atDoor = true; e.doorTimer = 0; e.litT = 0;
      SND.knock();
    } else {
      SND.step();
    }
  }
}
function retreat(e, back){
  e.idx = Math.max(0, e.idx - (back || 2));
  e.atDoor = false; e.doorTimer = 0;
  e.retreats++;
  e.timer = (e.cfg.iv || 5) * 1.25;
  SND.shriek();
}
function enemyRoom(e){ return e.path[e.idx]; }
function atDoor(side){
  for (const e of G.enemies){
    if (e.active && e.atDoor && DOOR_OF[enemyRoom(e)] === side) return e;
  }
  return null;
}

function drainRate(){
  const conf = NIGHTS[G.night - 1];
  let r = 0.085;
  if (G.doors.L) r += 0.21;
  if (G.doors.R) r += 0.21;
  if (G.doors.V) r += 0.15;
  if (G.lights.L) r += 0.15;
  if (G.lights.R) r += 0.15;
  if (G.lights.V) r += 0.13;
  if (G.camUp) r += 0.11;
  if (G.bang) r += 0.25;
  return r * conf.drain;
}
function usageBlocks(){
  let n = 1;
  if (G.doors.L) n++; if (G.doors.R) n++; if (G.doors.V) n++;
  if (G.lights.L) n++; if (G.lights.R) n++; if (G.lights.V) n++;
  if (G.camUp) n++;
  return n;
}

/* ------------------------------ update --------------------------------- */
function update(dt){
  G.time += dt;
  if (G.state !== 'play') SND.setLine(0);
  if (G.state === 'play') updatePlay(dt);
  else if (G.state === 'jumpscare'){
    G.jsT += dt;
    if (G.jsT > 2.1) endJumpscare();
  }
  if (G.msgT > 0) G.msgT -= dt;
  if (G.flash > 0) G.flash -= dt * 3;
  if (G.shake > 0) G.shake -= dt * 4;
  if (G.fade > 0) G.fade = Math.max(0, G.fade - dt * 1.7);
  if (pendingClick){
    const p = pendingClick; pendingClick = null;
    const id = hitButton(p);
    if (id) doAction(id);
  }
}

function updatePlay(dt){
  const conf = NIGHTS[G.night - 1];

  // czas
  G.nightTime += dt;
  const h = Math.floor(G.nightTime / G.hourLen);
  G.hour = Math.min(h, 6);
  if (G.hour >= 6){ win(); return; }

  // energia
  if (!G.blackout){
    G.power -= drainRate() * dt;
    if (G.power <= 0){ G.power = 0; powerOut(); }
    else if (G.power < 20 && Math.random() < 0.02) SND.warn();
  } else {
    G.blackoutT -= dt;
    if (G.blackoutT <= 0){ attack('G'); return; }
  }

  // pozytywka / Marionetka
  if (G.windEnabled){
    const cfg = conf.enemies.D;
    const onC6 = G.camUp && G.cam === 'C6';
    G.winding = onC6 && windHeld();
    if (G.winding){ G.wind = Math.min(100, G.wind + 34 * dt); SND.gen(); }
    else G.wind = Math.max(0, G.wind - cfg.decay * dt);
    if (G.dState === 'calm'){
      if (G.wind <= 0.5){ G.dState = 'emerging'; G.dTimer = cfg.cd; msg('Pozytywka umilkła... coś wstało w piwnicy.'); SND.warn(); }
    } else {
      G.dTimer -= dt;
      if (G.winding && G.wind > 12){ G.dState = 'calm'; G.wind = Math.max(G.wind, 22); msg('Marionetka wróciła do skrzyni.'); SND.blip(); }
      else if (G.dTimer <= 0){ attack('D'); return; }
    }
  }

  // telefon
  updPhone(dt);

  // przeciwnicy
  if (!G.blackout){
    for (const e of G.enemies) updEnemy(e, dt);
  }

  // dodatkowe warunki drzwi
  G.bang = false;
  const b = G.enemies.find(e => e.id === 'B');
  if (b && b.active && b.atDoor && G.doors.R){
    G.bang = true;
    if (Math.random() < 0.02) SND.bang();
  }

  // dźwięk bliskości
  const anyDoor = G.enemies.some(e => e.active && e.atDoor);
  SND.setFan(anyDoor ? 0.14 : 0.05);
  const anyLight = G.lights.L || G.lights.R || G.lights.V;
  SND.setHum(anyLight ? 0.035 : 0);

  // efekty
  if (G.glitch > 0) G.glitch -= dt;
  if (G.flicker > 0) G.flicker -= dt;

  // zdarzenia atmosferyczne
  G.ambT -= dt;
  if (G.ambT <= 0){
    G.ambT = 22 + Math.random() * 28;
    const roll = Math.random();
    if (G.night >= 3 && roll < 0.3){ G.glitch = 1.2 + Math.random() * 1.2; msg('Zakłócenia obrazu...'); SND.noise(0.6, 0.14, 3000, 'highpass'); }
    else if (roll < 0.5){ SND.step(); }
    else if (roll < 0.65){ SND.shriek(); }
    else if (roll < 0.8){ G.flicker = 0.7; SND.noise(0.5, 0.12, 1400, 'bandpass'); }
    else { SND.noise(0.9, 0.1, 700); }
  }
}

function updEnemy(e, dt){
  const room = enemyRoom(e);

  if (e.atDoor){
    const side = DOOR_OF[room];
    const closed = G.doors[side];
    const lit = G.lights[side];
    e.doorTimer += dt;

    if (e.id === 'A'){
      // Kurator: światło go paraliżuje, po ~2 s gasi go i wycofuje się
      if (lit){ e.litT += dt; } else { e.litT = 0; }
      if (closed){
        if (e.doorTimer > 5) retreat(e);
      } else if (lit){
        if (e.litT > 2.0){ msg('Kurator cofnął się przed światłem.'); retreat(e); }
      } else if (e.doorTimer > e.cfg.atk){
        attack('A'); return;
      }
    } else if (e.id === 'B'){
      // Ten, Który Czeka: zamknięte drzwi blokują, ale on w nie wali
      if (closed){
        if (e.doorTimer > 6.5) retreat(e);
      } else if (e.doorTimer > e.cfg.atk){
        attack('B'); return;
      }
    } else if (e.id === 'C'){
      // Świetlik: leci do światła, zatrzymuje go tylko kratka
      if (closed){
        if (e.doorTimer > 4.5) retreat(e);
      } else {
        const atk = lit ? 0.9 : e.cfg.atk;
        if (e.doorTimer > atk){ attack('C'); return; }
      }
    } else if (e.id === 'E'){
      // Bonifacy: światło go paraliżuje (i tylko paraliżuje), a drzwi odpędzają
      if (closed){
        if (e.doorTimer > 6) retreat(e);
      } else if (lit){
        e.litT += dt;
        e.doorTimer = 0.2;
        if (e.litT > 6) msg('Bonifacy stoi nieruchomo w świetle reflektora...');
      } else {
        e.litT = 0;
        if (e.doorTimer > e.cfg.atk){ attack('E'); return; }
      }
    } else if (e.id === 'F'){
      // Gospodarz: nie ogląda się na światło — zatrzymują go tylko drzwi
      if (closed){
        if (e.doorTimer > 8) retreat(e);
      } else if (e.doorTimer > e.cfg.atk){
        attack('F'); return;
      }
    } else if (e.id === 'H'){
      // Lisek: wpada pędem — masz ułamek sekundy na drzwi
      if (closed){
        if (e.doorTimer > 0.55){
          msg('Lisek uderzył w drzwi i wrócił do kręgielni.');
          SND.bang();
          retreat(e, 99);
        }
      } else if (e.doorTimer > e.cfg.atk){
        attack('H'); return;
      }
    }
    return;
  }

  // Lisek: ładuje się, gdy nikt na niego nie patrzy
  if (e.id === 'H'){
    const watchedH = G.camUp && ROOM_CAM[room] === G.cam;
    if (watchedH){
      if (e.charge > 6 && !e.warned) msg('Lisek cofnął się w cień kręgielni.');
      e.charge = 0; e.warned = false;
      return;
    }
    e.charge += dt * (e.cfg.chg || 5);
    if (e.charge >= 60 && !e.warned){
      e.warned = true;
      msg('W kręgielni coś się poruszyło. Sprawdź C11!');
      SND.warn();
    }
    if (e.charge >= 100){
      e.charge = 0; e.warned = false;
      if (e.idx >= e.path.length - 2){
        e.idx = e.path.length - 1;
        e.atDoor = true; e.doorTimer = 0; e.litT = 0;
        SND.run();
        msg('Lisek biegnie korytarzem — zamknij drzwi!');
        G.shake = 0.6;
      } else {
        advanceEnemy(e);
      }
    }
    return;
  }

  // Gospodarz: idzie tylko wtedy, gdy patrzysz na monitory
  if (e.id === 'F'){
    if (!G.camUp) return;
    e.timer -= dt;
    if (e.timer <= 0){
      e.timer = e.cfg.iv;
      if (Math.random() < e.cfg.ch) advanceEnemy(e);
    }
    return;
  }

  // ruch w korytarzach
  if (e.id === 'B'){
    // Ten, Który Czeka: stoi nieruchomo, gdy patrzysz na jego korytarz.
    // W każdej innej sytuacji pełznie do przodu, a każda zmiana obrazu go przyspiesza.
    const watchedB = G.camUp && ROOM_CAM[room] === G.cam;
    if (watchedB) return;
    e.timer -= dt * (G.camUp ? 1 : 0.5);
    if (e.timer <= 0){
      e.timer = e.cfg.iv;
      if (Math.random() < e.cfg.ch) advanceEnemy(e);
    }
    return;
  }

  const watched = G.camUp && ROOM_CAM[room] === G.cam;
  let speed = 1.0;
  if (e.id === 'C' && G.lights.V) speed = 2.0;       // Świetlik leci do światła
  if (e.id === 'E' && G.camUp) speed = 1.35;          // Bonifacy rusza się, gdy ktoś patrzy
  if (e.id === 'F' && G.camUp) speed = 0;
  e.timer -= dt * speed;
  if (e.timer <= 0){
    e.timer = e.cfg.iv;
    // Kurator zamiera, gdy patrzysz na jego pomieszczenie
    const block = (e.id === 'A' && watched);
    // zamknięta kratka spowalnia Świetlika
    if (e.id === 'C' && G.doors.V) e.timer += e.cfg.iv * 0.6;
    if (!block && Math.random() < e.cfg.ch) advanceEnemy(e);
  }
}

/* --------------------------- dispatch klików ---------------------------- */
function doAction(id){
  const st = G.state;
  if (st === 'menu'){
    if (id === 'newgame') startNight(1);
    else if (id === 'cont') startNight(save.night);
    else if (id === 'lore') G.state = 'lore';
    else if (id === 'how') G.state = 'how';
    else if (id === 'mute') SND.setMute(!SND.muted);
    else if (id === 'full') toggleFull();
    return;
  }
  if (st === 'intro'){ if (id === 'startintro') beginPlay(); return; }
  if (st === 'lore' || st === 'how'){ if (id === 'back') G.state = 'menu'; return; }
  if (st === 'pause'){
    if (id === 'resume') G.state = 'play';
    else if (id === 'tomenu') G.state = 'menu';
    return;
  }
  if (st === 'gameover'){
    if (id === 'retry') retry();
    else if (id === 'tomenu') G.state = 'menu';
    return;
  }
  if (st === 'win'){
    if (id === 'next') nextNight();
    else if (id === 'tomenu') G.state = 'menu';
    return;
  }
  if (st === 'play'){
    if (id === 'doorL') toggleDoor('L');
    else if (id === 'doorR') toggleDoor('R');
    else if (id === 'doorV') toggleDoor('V');
    else if (id === 'lightL') toggleLight('L');
    else if (id === 'lightR') toggleLight('R');
    else if (id === 'lightV') toggleLight('V');
    else if (id === 'monitor') toggleCams();
    else if (id === 'phone') phoneAction();
    else if (id === 'recall') phoneAction();
    else if (id === 'mute') SND.setMute(!SND.muted);
    else if (id === 'full') toggleFull();
    else if (id && id.slice(0, 3) === 'cam') setCam('C' + id.slice(3));
  }
}

/* ------------------------------ render --------------------------------- */
function render(){
  frameButtons = [];
  windRect = null;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (G.state === 'menu') renderMenu();
  else if (G.state === 'intro') renderIntro();
  else if (G.state === 'lore') renderLore();
  else if (G.state === 'how') renderHow();
  else if (G.state === 'jumpscare') renderJumpscare();
  else if (G.state === 'gameover') renderGameOver();
  else if (G.state === 'win') renderWin();
  else if (G.state === 'pause'){ renderPlay(); renderPause(); }
  else if (G.state === 'play') renderPlay();

  // winieta CRT na całej scenie
  const vg = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 820);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (G.fade > 0.001){
    ctx.globalAlpha = Math.min(1, G.fade);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

  const e = atDoor(side);
  if (e){

    if (on){
      drawSil(x + w / 2, y + h - 20, 1.25, e, 0.95);

function drawSil(x, y, s, e, alpha){
  const v = EVIS[e.id];
  const kind = v.kind || 'man';
  ctx.save();
  ctx.globalAlpha = alpha == null ? 0.92 : alpha;
  ctx.fillStyle = v.col;

  if (kind === 'rabbit'){
    // króliczek: długie uszy, wąskie ramiona
    ctx.beginPath(); ctx.ellipse(x - 9 * s, y - 158 * s, 6 * s, 26 * s, -0.14, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 9 * s, y - 158 * s, 6 * s, 26 * s, 0.14, 0, 7); ctx.fill();
    ctx.fillRect(x - 15 * s, y - 106 * s, 9 * s, 88 * s);
    ctx.fillRect(x + 6 * s, y - 106 * s, 9 * s, 88 * s);
  } else if (kind === 'bear'){
    // miś: okrągłe uszy i bary szersze niż wzrost
    ctx.beginPath(); ctx.arc(x - 17 * s, y - 150 * s, 10 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 17 * s, y - 150 * s, 10 * s, 0, 7); ctx.fill();
    ctx.fillRect(x - 42 * s, y - 106 * s, 15 * s, 86 * s);
    ctx.fillRect(x + 27 * s, y - 106 * s, 15 * s, 86 * s);
  } else if (kind === 'fox'){
    // lisek: spiczaste uszy i pyszczek, sylwetka w pochyleniu
    ctx.beginPath(); ctx.moveTo(x - 16 * s, y - 142 * s); ctx.lineTo(x - 22 * s, y - 172 * s);
    ctx.lineTo(x - 6 * s, y - 150 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 16 * s, y - 142 * s); ctx.lineTo(x + 22 * s, y - 172 * s);
    ctx.lineTo(x + 6 * s, y - 150 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 8 * s, y - 128 * s); ctx.lineTo(x + 26 * s, y - 120 * s);
    ctx.lineTo(x + 6 * s, y - 108 * s); ctx.closePath(); ctx.fill();
    ctx.fillRect(x - 34 * s, y - 104 * s, 11 * s, 80 * s);
    ctx.fillRect(x + 23 * s, y - 100 * s, 11 * s, 76 * s);
  } else if (kind === 'bug'){
    ctx.fillRect(x - 34 * s, y - 100 * s, 10 * s, 76 * s);
    ctx.fillRect(x + 24 * s, y - 100 * s, 10 * s, 76 * s);
  } else {
    ctx.fillRect(x - 38 * s, y - 106 * s, 12 * s, 84 * s);
    ctx.fillRect(x + 26 * s, y - 106 * s, 12 * s, 84 * s);
  }

  ctx.beginPath();
  ctx.moveTo(x - 26 * s, y);
  ctx.lineTo(x - 20 * s, y - 112 * s);
  ctx.lineTo(x + 20 * s, y - 112 * s);
  ctx.lineTo(x + 26 * s, y);
  ctx.closePath(); ctx.fill();

  if (kind === 'bear'){
    ctx.beginPath(); ctx.ellipse(x, y - 130 * s, 24 * s, 26 * s, 0, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 'fox'){
    ctx.beginPath(); ctx.ellipse(x, y - 124 * s, 21 * s, 26 * s, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(x, y - 132 * s, 20 * s, 25 * s, 0, 0, Math.PI * 2); ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.fillStyle = v.eye;
  const ey = kind === 'fox' ? -127 * s : (kind === 'bear' ? -133 * s : -136 * s);
  ctx.beginPath(); ctx.arc(x - 8 * s, y + ey, 3.2 * s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 8 * s, y + ey, 3.2 * s, 0, 7); ctx.fill();
  const gl = ctx.createRadialGradient(x, y + ey, 1, x, y + ey, 46 * s);
  gl.addColorStop(0, v.eye); gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y + ey, 46 * s, 0, 7); ctx.fill();
  ctx.restore();
}

/* --------------------------- kamery ------------------------------------- */
function mouseInRect(r){
  return !!r && mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h;
}
function windHeld(){ return !!keys['w'] || (mouse.down && mouseInRect(windRect)); }

function renderCams(){
  const cam = G.cam;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 56, 980, 504); ctx.clip();
  if (G.shake > 0){
    const sh = G.shake * 9;
    ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  }
  drawFeedRoom(cam);

  // przeciwnicy w pomieszczeniu
  for (const e of G.enemies){
    if (!e.active) continue;
    const room = enemyRoom(e);
    const inRoom = !e.atDoor && room === CAM_ROOM[cam];
    const atVentDoor = e.atDoor && room === 'doorV' && cam === 'C8';
    if (!inRoom && !atVentDoor) continue;
    const sp = enemySpot(cam, e.id, atVentDoor);
    drawSil(sp.x, sp.y, sp.s, e, 0.95);
  }

  drawFeedOverlay(cam);
  ctx.restore();
  drawSidebar();
}

function enemySpot(cam, id, ventDoor){
  const r = mulberry32(hashStr(cam + id) ^ 0x85ebca6b);
  let x = 140 + r() * 560;
  let y = 420 + r() * 80;
  let s = 0.95 + r() * 0.35;
  if (cam === 'C8'){ x = 420 + r() * 140; y = ventDoor ? 470 : 420; s = 0.55; }
  else if (cam === 'C7'){ y = 468 + r() * 24; }          // kino: w rzędach foteli
  else if (cam === 'C11'){ y = 496 + r() * 20; s = 1.0; } // kręgielnia: blisko kamery
  else if (cam === 'C6'){ x = 250 + r() * 180; y = 500; } // piwnica: przy skrzyni
  return { x, y, s };
}

/* ---------------------- scenografia pomieszczeń -------------------------- */
function box(x, y, w, h, col, edge){
  ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
  if (edge){ ctx.strokeStyle = edge; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2); }
}
function lampAt(x, y, r, col, cy){
  const lg = ctx.createRadialGradient(x, y, 4, x, y, r);
  lg.addColorStop(0, col); lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function perspective(rnd){
  const vx = 300 + rnd() * 380;
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 14; i++){
    const x = i * 70;
    ctx.beginPath(); ctx.moveTo(x, 330); ctx.lineTo(vx + (x - vx) * 2.6, 560); ctx.stroke();
  }
  for (let i = 1; i <= 6; i++){
    const y = 330 + i * 40;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(980, y); ctx.stroke();
  }
}
function ceilingLamp(x, y, r, col, on){
  if (on) lampAt(x, y, r, col);
  ctx.fillStyle = on ? 'rgba(200,220,190,0.28)' : 'rgba(60,70,60,0.25)';
  ctx.fillRect(x - 30, y - 5, 60, 9);
}

function drawFace(cx, cy, s, e, t){
  const v = EVIS[e.id];
  const kind = v.kind || 'man';
  ctx.save();
  ctx.translate(cx, cy);

  // uszy / pyszczek zależne od maskotki
  ctx.fillStyle = v.col;
  if (kind === 'rabbit'){
    ctx.save(); ctx.rotate(-0.15);
    ctx.beginPath(); ctx.ellipse(-74 * s, -206 * s, 30 * s, 86 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,110,155,0.20)';
    ctx.beginPath(); ctx.ellipse(-74 * s, -206 * s, 14 * s, 56 * s, 0, 0, 7); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.rotate(0.15);
    ctx.fillStyle = v.col;
    ctx.beginPath(); ctx.ellipse(74 * s, -206 * s, 30 * s, 86 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,110,155,0.20)';
    ctx.beginPath(); ctx.ellipse(74 * s, -206 * s, 14 * s, 56 * s, 0, 0, 7); ctx.fill();
    ctx.restore();
  } else if (kind === 'bear'){
    ctx.beginPath(); ctx.arc(-118 * s, -146 * s, 60 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(118 * s, -146 * s, 60 * s, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,185,110,0.12)';
    ctx.beginPath(); ctx.arc(-118 * s, -146 * s, 32 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(118 * s, -146 * s, 32 * s, 0, 7); ctx.fill();
  } else if (kind === 'fox'){
    ctx.beginPath(); ctx.moveTo(-144 * s, -122 * s); ctx.lineTo(-188 * s, -298 * s);
    ctx.lineTo(-52 * s, -170 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(144 * s, -122 * s); ctx.lineTo(188 * s, -298 * s);
    ctx.lineTo(52 * s, -170 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,140,90,0.13)';
    ctx.beginPath(); ctx.moveTo(-140 * s, -136 * s); ctx.lineTo(-168 * s, -260 * s);
    ctx.lineTo(-82 * s, -170 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(140 * s, -136 * s); ctx.lineTo(168 * s, -260 * s);
    ctx.lineTo(82 * s, -170 * s); ctx.closePath(); ctx.fill();
  }

  // głowa
  const hg = ctx.createRadialGradient(-30 * s, -70 * s, 20 * s, 0, 10 * s, 260 * s);
  hg.addColorStop(0, v.col);
  hg.addColorStop(1, '#050406');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.ellipse(0, 0, 158 * s, 186 * s, 0, 0, 7); ctx.fill();

  // jaśniejszy pyszczek misia
  if (kind === 'bear'){
    ctx.fillStyle = 'rgba(210,180,140,0.10)';
    ctx.beginPath(); ctx.ellipse(0, 96 * s, 104 * s, 74 * s, 0, 0, 7); ctx.fill();
  }

  // usta (zęby zawsze wyrównane do krawędzi)
  const mTop = 58 * s;
  const mBot = (140 + (0.5 + 0.5 * Math.sin(t * 24)) * 32) * s;
  const topW = 120 * s, botW = 100 * s;
  ctx.fillStyle = '#070609';
  ctx.beginPath();
  ctx.moveTo(-topW, mTop); ctx.lineTo(topW, mTop);
  ctx.lineTo(botW, mBot); ctx.lineTo(-botW, mBot);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#cfc7b0';
  const nT = 8, tw = (2 * botW) / nT, th = Math.min(26 * s, (mBot - mTop) / 2);
  for (let i = 0; i < nT; i++){
    const x = -botW + i * tw;
    ctx.beginPath();
    ctx.moveTo(x, mTop); ctx.lineTo(x + tw, mTop); ctx.lineTo(x + tw / 2, mTop + th);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, mBot); ctx.lineTo(x + tw, mBot); ctx.lineTo(x + tw / 2, mBot - th);
    ctx.closePath(); ctx.fill();
  }

  // lisek: ciemny pyszczek z nosem na zębach
  if (kind === 'fox'){
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = '#0b0709';
    ctx.beginPath(); ctx.moveTo(-62 * s, 2 * s); ctx.lineTo(0, 122 * s);
    ctx.lineTo(62 * s, 2 * s); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#1a1114';
    ctx.beginPath(); ctx.arc(0, 20 * s, 12 * s, 0, 7); ctx.fill();
  }

  // oczy
  const ey = kind === 'fox' ? -54 * s : (kind === 'bear' ? -34 * s : -44 * s);
  ctx.fillStyle = v.eye;
  if (kind === 'fox'){
    ctx.beginPath(); ctx.moveTo(-96 * s, ey - 22 * s); ctx.lineTo(-26 * s, ey - 4 * s);
    ctx.lineTo(-30 * s, ey + 24 * s); ctx.lineTo(-96 * s, ey + 12 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(96 * s, ey - 22 * s); ctx.lineTo(26 * s, ey - 4 * s);
    ctx.lineTo(30 * s, ey + 24 * s); ctx.lineTo(96 * s, ey + 12 * s); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(-60 * s, ey, 27 * s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(60 * s, ey, 27 * s, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-58 * s + Math.sin(t * 9) * 4, ey, 11 * s, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(58 * s + Math.sin(t * 9) * 4, ey, 11 * s, 0, 7); ctx.fill();

  // groźne brwi dla maskotek
  if (kind !== 'man' && kind !== 'bug' && kind !== 'doll'){
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 12 * s;
    ctx.beginPath(); ctx.moveTo(-96 * s, ey - 46 * s); ctx.lineTo(-22 * s, ey - 26 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(96 * s, ey - 46 * s); ctx.lineTo(22 * s, ey - 26 * s); ctx.stroke();
  }
  ctx.restore();
}

function wrapText(s, maxW, size, weight){
  ctx.font = (weight || 'normal') + ' ' + size + 'px "Segoe UI",Roboto,Arial,sans-serif';
  const words = s.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words){
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

}

function renderIntro(){
  const conf = NIGHTS[G.night - 1];
  ctx.fillStyle = '#030405'; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, 340, 30, W / 2, 340, 600);
  rg.addColorStop(0, 'rgba(40,20,30,0.35)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  txt('NOC ' + G.night + ' / ' + NIGHTS.length, W / 2, 180, 30, '#8c2f3b', 'center', 'bold');
  txt(HOURS[0] + '  →  6:00 AM', W / 2, 226, 18, '#5c646e', 'center');

  const chars = Math.floor(stateT * 42);
  const full = conf.intro;
  const shown = full.slice(0, chars);
  const lines = wrapText(shown, 760, 21);
  for (let i = 0; i < lines.length; i++){
    txt(lines[i], W / 2, 330 + i * 34, 21, '#cdd6e0', 'center');
  }

  if (chars >= full.length){
    const a = 0.5 + 0.5 * Math.sin(stateT * 3);
    ctx.globalAlpha = a;
    txt('SPACJA / KLIKNIJ, ABY ROZPOCZĄĆ ZMIANĘ', W / 2, 560, 20, '#c8b06a', 'center', 'bold');
    ctx.globalAlpha = 1;
  }
  hotspot('startintro', 0, 0, W, H);
  btn('startintro', W / 2 - 150, 600, 300, 52, 'ROZPOCZNIJ', false);
}

function renderLore(){
  ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, W, H);
  txt('WPISY Z KSIĘGI ZMIAN', W / 2, 70, 32, '#c8b06a', 'center', 'bold');
  txt('odblokowujesz po jednym wpisie za każdą przetrwaną noc', W / 2, 100, 15, '#5e6874', 'center');

  let y = 148;
  for (let i = 0; i < NOTES.length; i++){
    const open = save.notes[i];
    ctx.fillStyle = open ? 'rgba(35,30,22,0.55)' : 'rgba(20,22,26,0.5)';
    ctx.fillRect(120, y - 26, W - 240, open ? 96 : 42);
    ctx.strokeStyle = open ? '#4a3f28' : '#242b34'; ctx.lineWidth = 2;
    ctx.strokeRect(121, y - 25, W - 242, (open ? 96 : 42) - 2);
    txt(open ? NOTES[i].t : 'WPIS ' + (i + 1) + ' — zablokowany (przetrwaj noc ' + (i + 1) + ')',
        140, y, 19, open ? '#e2d6b4' : '#3f4750', 'left', 'bold');
    if (open){
      const lines = wrapText(NOTES[i].b, W - 300, 16);
      for (let k = 0; k < Math.min(lines.length, 4); k++){
        txt(lines[k], 140, y + 26 + k * 20, 16, '#a9b2bd');
      }
    }
    y += open ? 108 : 54;
  }
  btn('back', W / 2 - 110, 668, 220, 40, 'WRÓĆ [ESC]', false);
}

function renderPause(){
  ctx.fillStyle = 'rgba(0,0,0,0.78)'; ctx.fillRect(0, 0, W, H);
  txt('PAUZA', W / 2, 280, 48, '#e8dfd0', 'center', 'bold');

function renderGameOver(){
  ctx.fillStyle = '#0a0405'; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, 300, 30, W / 2, 300, 620);
  rg.addColorStop(0, 'rgba(140,20,25,0.28)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  const shake = Math.max(0, 8 - stateT * 8);
  const ox = (Math.random() - 0.5) * shake, oy = (Math.random() - 0.5) * shake;
  txt('NIE PRZETRWAŁEŚ', W / 2 + ox, 220 + oy, 52, '#a8333f', 'center', 'bold');

  txt(DEATH_TEXT[G.jumpEnemy] || '...', W / 2, 330, 22, '#cfd8e4', 'center');

    'Światło w drzwiach odstrasza Kuratora, ale kosztuje energię.',
    'W wentylacji nigdy nie zapalaj lampy — Świetlik leci do światła.',
    'Bez melodi pozytywki Marionetka wstaje w kilkanaście sekund.'
  ][Math.floor(Math.random() * 5)]), W / 2, 580, 17, '#8a939f', 'center');

function renderWin(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0d10'); g.addColorStop(1, '#141612');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, 240, 40, W / 2, 240, 640);
  rg.addColorStop(0, 'rgba(200,190,140,0.18)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  txt('6:00 AM', W / 2, 190, 76, '#e8dfd0', 'center', 'bold');
  txt('PRZETRWAŁEŚ NOC ' + G.night, W / 2, 240, 26, '#c8b06a', 'center', 'bold');

  const note = NOTES[clamp(G.night - 1, 0, NOTES.length - 1)];
  txt(note.t.toUpperCase(), W / 2, 306, 20, '#8a939f', 'center', 'bold');
  const lines = wrapText(note.b, 820, 17);
  for (let i = 0; i < lines.length; i++){
    txt(lines[i], W / 2, 342 + i * 24, 17, '#a9b2bd', 'center');
  }
  txt('Odblokowano wpis ' + (clamp(G.night, 1, 6)) + ' / 6.', W / 2, 470, 16, '#5e6874', 'center');

  const last = G.night >= NIGHTS.length;
  if (last){
    txt('To była ostatnia zmiana. Budynek zostaje za tobą — razem z tym, co w nim czekało.', W / 2, 512, 18, '#c8b06a', 'center');
    btn('tomenu', W / 2 - 170, 560, 340, 54, 'MENU GŁÓWNE [ESC]', false);
  } else {
    btn('next', W / 2 - 170, 520, 340, 54, 'NASTĘPNA NOC (NOC ' + (G.night + 1) + ')', false);
    btn('tomenu', W / 2 - 170, 586, 340, 54, 'MENU GŁÓWNE', false);
  }
}

/* ------------------------------ pętla ----------------------------------- */
let lastTime = performance.now();
let stateT = 0, lastState = '';

function loop(now){
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!isFinite(dt) || dt < 0) dt = 0.016;
  dt = Math.min(dt, 0.05);

  if (lastState !== G.state){
    lastState = G.state;
    stateT = 0;
    if (G.state === 'intro' || G.state === 'play' || G.state === 'jumpscare' ||
        G.state === 'gameover' || G.state === 'win' || G.state === 'menu') G.fade = 0.85;
  }
  stateT += dt;

  if (G.state === 'play') tipTick(dt);
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
